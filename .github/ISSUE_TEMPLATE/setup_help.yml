name: '🔧 Hỗ trợ cài đặt'
description: Hỏi khi bạn gặp khó khăn trong lúc cài đặt hoặc cấu hình Hermes.
title: '[Cài đặt]: '
labels: ['setup']
body:
  - type: markdown
    attributes:
      value: |
        Rất tiếc vì bạn đang gặp khó khăn. Vui lòng cung cấp các thông tin bên dưới để chúng tôi hỗ trợ.

        **Kiểm tra nhanh trước:**
        - Xem [hướng dẫn tiếng Việt](https://github.com/LucDinhLe/hermes-agent-vietnamese/blob/main/README.vi.md)
        - Tải đúng gói từ [trang Bản phát hành](https://github.com/LucDinhLe/hermes-agent-vietnamese/releases)
        - Nếu cần chẩn đoán, ưu tiên chạy `hermes debug share --local` và xóa thông tin nhạy cảm trước khi chia sẻ

  - type: textarea
    id: description
    attributes:
      label: Bạn đang gặp vấn đề gì?
      description: Mô tả việc bạn đang làm và bước xảy ra lỗi.
      placeholder: |
        Tôi chạy `hermes setup` và chọn Nous Portal, nhưng khi mở Gateway thì...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Các bước đã thực hiện
      description: Bạn đã làm gì? Hãy ghi chính xác câu lệnh đã chạy.
      placeholder: |
        1. Chạy trình cài đặt...
        2. Mở Hermes...
        3. Chọn OpenRouter và nhập khóa API...
        4. Gửi tin nhắn rồi gặp lỗi...
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Cách cài đặt
      options:
        - Bộ cài Desktop từ GitHub Releases
        - Tập lệnh cài đặt (curl | bash)
        - Tự clone mã nguồn và cài bằng pip/uv
        - Trình cài PowerShell (Windows)
        - Docker
        - Khác
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Hệ điều hành
      placeholder: Ubuntu 24.04 / macOS 15.2 / Windows 11
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Phiên bản Python
      description: Kết quả của `python --version` hoặc `python3 --version`
      placeholder: '3.11.9'

  - type: input
    id: hermes-version
    attributes:
      label: Phiên bản Hermes
      description: Kết quả của `hermes version` nếu đã cài đến bước này
      placeholder: '2.1.0'

  - type: textarea
    id: debug-report
    attributes:
      label: Báo cáo chẩn đoán
      description: |
        Ưu tiên chạy `hermes debug share --local`, kiểm tra và xóa khóa API, mã OAuth, đường dẫn riêng tư hoặc dữ liệu cá nhân trước khi dán phần liên quan vào đây.

        Chỉ dùng `hermes debug share` hoặc `/debug` khi bạn hiểu nội dung nào sẽ được tải lên dịch vụ chia sẻ văn bản. Nếu quá trình cài đặt chưa hoàn tất, dùng `hermes doctor` rồi dán phần kết quả không chứa bí mật.
      placeholder: |
        Report   https://paste.rs/abc123
        agent.log   https://paste.rs/def456
        gateway.log   https://paste.rs/ghi789
      render: shell

  - type: textarea
    id: error-output
    attributes:
      label: Toàn bộ thông báo lỗi
      description: Dán toàn bộ thông báo lỗi hoặc truy vết. Nội dung sẽ được tự động định dạng.
      render: shell
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: Những cách bạn đã thử
      description: Liệt kê các cách sửa hoặc giải pháp tạm thời bạn đã thử.
      placeholder: |
        - Tải lại bản cài mới nhất
        - Thử cài lại ứng dụng
        - Kiểm tra tài khoản hoặc khóa API
