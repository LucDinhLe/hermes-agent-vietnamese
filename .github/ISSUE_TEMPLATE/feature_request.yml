name: '✨ Đề xuất tính năng'
description: Đề xuất tính năng mới hoặc cách cải thiện Hermes tiếng Việt.
title: '[Tính năng]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã góp ý. Trước khi gửi, vui lòng cân nhắc:

        - **Đây có phải một kỹ năng mới?** Phần lớn khả năng mới nên được triển khai dưới dạng kỹ năng thay vì thêm vào công cụ lõi.
        - **Tìm trong [các đề xuất hiện có](https://github.com/LucDinhLe/hermes-agent-vietnamese/issues)** để tránh trùng lặp.

  - type: textarea
    id: problem
    attributes:
      label: Vấn đề hoặc tình huống sử dụng
      description: Tính năng này giải quyết vấn đề gì? Hiện bạn chưa thể làm việc gì?
      placeholder: |
        Tôi muốn dùng Hermes với [nhà cung cấp/nền tảng/quy trình] nhưng hiện chưa thể...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Giải pháp đề xuất
      description: Bạn muốn tính năng hoạt động thế nào? Hãy mô tả cụ thể về câu lệnh, cấu hình hoặc hành vi giao diện.
      placeholder: |
        Thêm tùy chọn `--foo` vào `hermes chat` để...
        Hoặc thêm khóa cấu hình `bar.baz` để kiểm soát...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Phương án khác đã cân nhắc
      description: Bạn đã cân nhắc cách nào khác? Vì sao giải pháp đề xuất phù hợp hơn?

  - type: dropdown
    id: type
    attributes:
      label: Loại tính năng
      options:
        - Công cụ mới
        - Kỹ năng tích hợp mới
        - Cải thiện CLI
        - Cải thiện Gateway / nhắn tin
        - Tùy chọn cấu hình
        - Hiệu năng / độ ổn định
        - Trải nghiệm nhà phát triển (kiểm thử, tài liệu, CI)
        - Khác
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Phạm vi
      description: Thay đổi này lớn đến mức nào?
      options:
        - Nhỏ (một tệp, dưới 50 dòng)
        - Vừa (một vài tệp, dưới 300 dòng)
        - Lớn (mô-đun mới hoặc tái cấu trúc đáng kể)

  - type: checkboxes
    id: pr-ready
    attributes:
      label: Đóng góp
      options:
        - label: Tôi muốn tự triển khai và gửi pull request

  - type: textarea
    id: debug-report
    attributes:
      label: Báo cáo chẩn đoán (không bắt buộc)
      description: |
        Nếu đề xuất liên quan đến một lỗi bạn đang gặp, hãy chạy `hermes debug share` và dán liên kết vào đây.
        Trong phiên trò chuyện tương tác, bạn có thể dùng `/debug`.
        Thông tin này giúp chúng tôi hiểu môi trường và nhật ký liên quan.
      placeholder: |
        Report   https://paste.rs/abc123
      render: shell
