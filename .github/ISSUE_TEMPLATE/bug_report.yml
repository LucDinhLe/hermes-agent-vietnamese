name: '🐛 Báo lỗi'
description: Báo ứng dụng bị hỏng, văng hoặc hoạt động không đúng.
title: '[Lỗi]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã báo lỗi. Vui lòng cung cấp đủ thông tin để chúng tôi có thể tái hiện và xử lý nhanh hơn.

        **Trước khi gửi:**
        - [ ] Tìm trong [các lỗi đã được báo](https://github.com/LucDinhLe/hermes-agent-vietnamese/issues) để tránh trùng lặp
        - [ ] Cập nhật lên bản mới nhất và xác nhận lỗi vẫn còn
        - [ ] Nếu có thể, chạy `hermes debug share --local`, xóa thông tin nhạy cảm rồi dán phần liên quan vào Báo cáo chẩn đoán

  - type: textarea
    id: description
    attributes:
      label: Mô tả lỗi
      description: Mô tả rõ phần bị lỗi. Kèm thông báo lỗi, truy vết hoặc ảnh chụp màn hình nếu có.
      placeholder: |
        Điều gì đã xảy ra? Bạn mong đợi ứng dụng hoạt động thế nào?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Các bước tái hiện
      description: Các bước ngắn nhất làm lỗi xuất hiện. Thông tin càng cụ thể thì việc sửa càng nhanh.
      placeholder: |
        1. Mở Hermes
        2. Gửi nội dung "..."
        3. AI agent gọi công cụ X
        4. Lỗi xuất hiện: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
      description: Ứng dụng lẽ ra phải hoạt động thế nào?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Kết quả thực tế
      description: Điều gì thực sự xảy ra? Dán toàn bộ thông báo lỗi nếu có.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Thành phần bị ảnh hưởng
      description: Phần nào của Hermes gặp lỗi?
      multiple: true
      options:
        - Giao diện Desktop
        - CLI (trò chuyện trong dòng lệnh)
        - Gateway (Telegram/Discord/Slack/WhatsApp)
        - Thiết lập / Cài đặt
        - Công cụ (terminal, tệp, web, thực thi mã, v.v.)
        - Kỹ năng (tải kỹ năng, Skills Hub, kiểm soát kỹ năng)
        - Lõi AI agent (hội thoại, nén ngữ cảnh, bộ nhớ)
        - Cấu hình (config.yaml, .env, hermes setup)
        - Khác
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Nền tảng nhắn tin (nếu liên quan Gateway)
      description: Nền tảng nào bị ảnh hưởng?
      multiple: true
      options:
        - Không áp dụng
        - Telegram
        - Discord
        - Slack
        - WhatsApp

  - type: textarea
    id: debug-report
    attributes:
      label: Báo cáo chẩn đoán
      description: |
        Ưu tiên chạy `hermes debug share --local`, kiểm tra và xóa khóa API, mã OAuth, đường dẫn riêng tư hoặc dữ liệu cá nhân trước khi dán phần liên quan vào đây.

        Chỉ dùng `hermes debug share` khi bạn hiểu nội dung nào sẽ được tải lên dịch vụ chia sẻ văn bản. Không đăng bí mật trong issue công khai.
      placeholder: |
        Report   https://paste.rs/abc123
        agent.log   https://paste.rs/def456
        gateway.log   https://paste.rs/ghi789
      render: shell

  - type: input
    id: os
    attributes:
      label: Hệ điều hành
      description: Ví dụ Ubuntu 24.04, macOS 15.2 hoặc Windows 11
      placeholder: Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Phiên bản Python
      description: Kết quả của lệnh `python --version`
      placeholder: '3.11.9'

  - type: input
    id: hermes-version
    attributes:
      label: Phiên bản Hermes
      description: Kết quả của lệnh `hermes version`
      placeholder: '2.1.0'

  - type: textarea
    id: logs
    attributes:
      label: Nhật ký / truy vết bổ sung (không bắt buộc)
      description: |
        Báo cáo chẩn đoán phía trên đã có phần lớn nhật ký. Dùng ô này cho thông báo lỗi,
        truy vết hoặc ảnh chụp chưa có trong kết quả `hermes debug share`.
      render: shell

  - type: textarea
    id: root-cause
    attributes:
      label: Phân tích nguyên nhân gốc (không bắt buộc)
      description: |
        Nếu bạn đã xem mã nguồn và xác định được nguyên nhân, hãy chia sẻ tại đây.
        Nêu đường dẫn tệp, số dòng và đoạn mã nếu có thể.
      placeholder: |
        The bug is in `gateway/run.py` line 949. `len(history)` counts session_meta entries
        but `agent_messages` was built from filtered history...

  - type: textarea
    id: proposed-fix
    attributes:
      label: Cách sửa đề xuất (không bắt buộc)
      description: Nếu bạn đã nghĩ ra cách sửa hoặc có sẵn pull request, hãy mô tả tại đây.
      placeholder: |
        Replace `.get()` with `.pop()` on line 289 of `gateway/platforms/base.py`
        to actually clear the pending message after retrieval.

  - type: checkboxes
    id: pr-ready
    attributes:
      label: Bạn có muốn tự sửa và gửi pull request không?
      options:
        - label: Tôi muốn tự sửa lỗi này và gửi pull request
