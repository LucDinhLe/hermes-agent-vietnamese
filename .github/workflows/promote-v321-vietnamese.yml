name: Công khai Hermes Vietnamese v32.1

on:
  workflow_dispatch:
    inputs:
      sha256sums_sha256:
        description: 'SHA-256 exact của SHA256SUMS.txt trong private draft'
        required: true
        type: string
      windows_x64_sha256:
        description: 'SHA-256 exact của installer Windows x64 đã ký'
        required: true
        type: string
      windows_x64_size:
        description: 'Kích thước byte exact của installer Windows x64 đã ký'
        required: true
        type: string
      staging_run_id:
        description: 'Run ID dựng một lần và staging private draft'
        required: true
        type: string
      lifecycle_run_id:
        description: 'Run ID vòng đời v32.1 đã đạt toàn bộ receipt'
        required: true
        type: string
      controller_sha:
        description: 'Full SHA của commit điều khiển promotion'
        required: true
        type: string

concurrency:
  group: hermes-vietnamese-promotion
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  promote:
    name: Xác minh exact byte, an toàn phiên và đưa v32.1 lên Latest
    runs-on: ubuntu-24.04
    environment: release-production
    steps:
      - name: Khóa commit điều khiển promotion
        shell: bash
        env:
          CONTROLLER_SHA: ${{ inputs.controller_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CONTROLLER_SHA" = "$DISPATCH_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.controller_sha }}

      - name: Tải và xác minh private staging cùng lifecycle receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: vi-v0.32.1-8
          EXPECTED_MANIFEST_SHA: ${{ inputs.sha256sums_sha256 }}
          EXPECTED_WINDOWS_SHA: ${{ inputs.windows_x64_sha256 }}
          EXPECTED_WINDOWS_SIZE: ${{ inputs.windows_x64_size }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          LIFECYCLE_RUN_ID: ${{ inputs.lifecycle_run_id }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_WINDOWS_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_WINDOWS_SIZE" =~ ^[1-9][0-9]*$ ]]
          [[ "$STAGING_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$LIFECYCLE_RUN_ID" =~ ^[1-9][0-9]*$ ]]

          candidate_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          [[ "$candidate_commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'CANDIDATE_COMMIT=%s\n' "$candidate_commit" >> "$GITHUB_ENV"

          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          tag_ref_type="$(jq -r .object.type <<<"$tag_ref")"
          tag_ref_object="$(jq -r .object.sha <<<"$tag_ref")"
          [[ "$tag_ref_type" == "tag" || "$tag_ref_type" == "commit" ]]
          [[ "$tag_ref_object" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$tag_ref_type" == "tag" ]]; then
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_ref_object")"
            test "$(jq -r .sha <<<"$tag_object")" = "$tag_ref_object"
            test "$(jq -r .object.type <<<"$tag_object")" = commit
            test "$(jq -r .object.sha <<<"$tag_object")" = "$candidate_commit"
          else
            test "$tag_ref_object" = "$candidate_commit"
          fi
          jq -n \
            --arg refType "$tag_ref_type" \
            --arg refObject "$tag_ref_object" \
            --arg peeledCommit "$candidate_commit" \
            '{refType: $refType, refObject: $refObject, peeledCommit: $peeledCommit}' \
            > candidate-tag-binding.json

          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --slurp > release-pages.json
          jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)]' release-pages.json > release-matches.json
          test "$(jq 'length' release-matches.json)" = 1
          jq '.[0]' release-matches.json > release-api.json
          release_id="$(jq -r .id release-api.json)"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --slurp > release-asset-pages.json
          jq --slurpfile pages release-asset-pages.json '.assets = [$pages[0][][]]' \
            release-api.json > release-api-complete.json
          mv release-api-complete.json release-api.json

          mkdir candidate lifecycle
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir candidate

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID" > staging-run.json
          test "$(jq -r .name staging-run.json)" = "Dựng và staging Hermes Vietnamese"
          test "$(jq -r .conclusion staging-run.json)" = success
          test "$(jq -r .head_sha staging-run.json)" = "$candidate_commit"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LIFECYCLE_RUN_ID" > lifecycle-run.json
          test "$(jq -r .name lifecycle-run.json)" = "Kiểm thử runtime artifact Hermes Vietnamese"
          test "$(jq -r .conclusion lifecycle-run.json)" = success
          test "$(jq -r .head_sha lifecycle-run.json)" = "$candidate_commit"
          run_attempt="$(jq -r .run_attempt lifecycle-run.json)"
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          lifecycle_name="v321-windows-lifecycle-$LIFECYCLE_RUN_ID-$run_attempt"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LIFECYCLE_RUN_ID/artifacts" > lifecycle-artifacts.json
          test "$(jq --arg name "$lifecycle_name" '[.artifacts[] | select(.name == $name)] | length' lifecycle-artifacts.json)" = 1
          gh run download "$LIFECYCLE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$lifecycle_name" --dir lifecycle

          node scripts/validate-v321-promotion.mjs \
            candidate lifecycle release-api.json lifecycle-run.json lifecycle-artifacts.json \
            "$EXPECTED_MANIFEST_SHA" "$LIFECYCLE_RUN_ID" "$STAGING_RUN_ID" \
            "$candidate_commit" "$EXPECTED_WINDOWS_SIZE" "$EXPECTED_WINDOWS_SHA" draft

      - name: Công khai Latest, hậu kiểm và tự khôi phục v32 nếu lỗi
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: vi-v0.32.1-8
          EXPECTED_MANIFEST_SHA: ${{ inputs.sha256sums_sha256 }}
          EXPECTED_WINDOWS_SHA: ${{ inputs.windows_x64_sha256 }}
          EXPECTED_WINDOWS_SIZE: ${{ inputs.windows_x64_size }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          LIFECYCLE_RUN_ID: ${{ inputs.lifecycle_run_id }}
        run: |
          set -euo pipefail
          release_id="$(jq -r .id release-api.json)"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > previous-latest.json
          previous_latest="$(jq -r .tag_name previous-latest.json)"
          previous_latest_id="$(jq -r .id previous-latest.json)"
          test "$previous_latest" = vi-v0.32.0-1
          [[ "$previous_latest_id" =~ ^[1-9][0-9]*$ ]]
          test "$release_id" != "$previous_latest_id"

          assert_tag_binding() {
            local expected_ref_type expected_ref_object expected_commit
            local current_ref current_ref_type current_ref_object current_commit current_tag_object
            expected_ref_type="$(jq -r .refType candidate-tag-binding.json)"
            expected_ref_object="$(jq -r .refObject candidate-tag-binding.json)"
            expected_commit="$(jq -r .peeledCommit candidate-tag-binding.json)"
            current_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
            current_ref_type="$(jq -r .object.type <<<"$current_ref")"
            current_ref_object="$(jq -r .object.sha <<<"$current_ref")"
            test "$current_ref_type" = "$expected_ref_type"
            test "$current_ref_object" = "$expected_ref_object"
            current_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
            test "$current_commit" = "$expected_commit"
            if [[ "$expected_ref_type" == "tag" ]]; then
              current_tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$expected_ref_object")"
              test "$(jq -r .object.type <<<"$current_tag_object")" = commit
              test "$(jq -r .object.sha <<<"$current_tag_object")" = "$expected_commit"
            else
              test "$expected_ref_object" = "$expected_commit"
            fi
          }
          assert_tag_binding

          rollback_publication() {
            local original_status=$?
            local rollback_failed=false
            trap - ERR
            echo "::error::V32.1 postcheck failed; returning $TAG to draft and restoring Latest=$previous_latest"
            if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=true -F prerelease=true -f make_latest=false > rollback-v321.json; then
              rollback_failed=true
            fi
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > rollback-v321-verify.json; then
              rollback_failed=true
            elif [[ "$(jq -r .draft rollback-v321-verify.json)" != "true" || \
              "$(jq -r .prerelease rollback-v321-verify.json)" != "true" ]]; then
              rollback_failed=true
            fi
            if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$previous_latest_id" \
              -f make_latest=true > rollback-latest.json; then
              rollback_failed=true
            fi
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/latest" > rollback-latest-verify.json; then
              rollback_failed=true
            elif [[ "$(jq -r .tag_name rollback-latest-verify.json)" != "$previous_latest" ]]; then
              rollback_failed=true
            fi
            if [[ "$rollback_failed" == "true" ]]; then
              echo "::error::Automatic v32.1 rollback verification failed; manual release repair is required"
            fi
            return "$original_status"
          }
          trap rollback_publication ERR

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -F prerelease=false -f make_latest=true > publication-response.json
          test "$(jq -r .id publication-response.json)" = "$release_id"
          assert_tag_binding

          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > published-release.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --slurp > published-asset-pages.json
          jq --slurpfile pages published-asset-pages.json '.assets = [$pages[0][][]]' \
            published-release.json > published-release-complete.json
          mv published-release-complete.json published-release.json
          mkdir public
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir public
          node scripts/validate-v321-promotion.mjs \
            public lifecycle published-release.json lifecycle-run.json lifecycle-artifacts.json \
            "$EXPECTED_MANIFEST_SHA" "$LIFECYCLE_RUN_ID" "$STAGING_RUN_ID" \
            "$CANDIDATE_COMMIT" "$EXPECTED_WINDOWS_SIZE" "$EXPECTED_WINDOWS_SHA" latest
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest-release.json
          test "$(jq -r .id latest-release.json)" = "$release_id"
          test "$(jq -r .tag_name latest-release.json)" = "$TAG"
          trap - ERR
