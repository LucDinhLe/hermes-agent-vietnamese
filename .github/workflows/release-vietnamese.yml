name: Dựng và staging Hermes Vietnamese

on:
  push:
    tags:
      - 'vi-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Nhãn ứng viên đã tồn tại, ví dụ vi-v0.20.0-15'
        required: true
        type: string
      release_class:
        description: 'Stable bắt buộc ký; community-prerelease cho phép unsigned và luôn công bố dạng prerelease'
        required: true
        default: community-prerelease
        type: choice
        options:
          - community-prerelease
          - stable

concurrency:
  group: hermes-vietnamese-candidate-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Kiểm tra commit và hợp đồng ứng viên
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      commit: ${{ steps.candidate.outputs.commit }}
      release_class: ${{ steps.candidate.outputs.release_class }}
      release_title: ${{ steps.candidate.outputs.release_title }}
      build_matrix: ${{ steps.candidate.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Tải lại tag ứng viên với retry giới hạn
        uses: ./.github/actions/retry
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        with:
          command: git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          attempts: '5'
          delay: '15'

      - name: Khóa nhãn và commit ứng viên
        id: candidate
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_CLASS: ${{ inputs.release_class || 'community-prerelease' }}
        run: |
          release_title="$(node -e "import('./scripts/vietnamese-release.mjs').then(({resolveVietnameseReleaseCandidate}) => process.stdout.write(resolveVietnameseReleaseCandidate(process.env.RELEASE_TAG).releaseTitle))")"
          case "$RELEASE_CLASS" in
            community-prerelease|stable) ;;
            *) echo "::error::unsupported release class: $RELEASE_CLASS"; exit 1 ;;
          esac
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          head_commit="$(git rev-parse HEAD)"
          test "$tag_commit" = "$head_commit" || { echo "::error::tag $RELEASE_TAG points to $tag_commit, checkout is $head_commit"; exit 1; }
          git diff --quiet
          git diff --cached --quiet
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$head_commit" >> "$GITHUB_OUTPUT"
          echo "release_class=$RELEASE_CLASS" >> "$GITHUB_OUTPUT"
          echo "release_title=$release_title" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == "vi-v0.32.1-16" ]]; then
            build_matrix='{"include":[{"id":"windows-x64","label":"Windows x64","runner":"windows-2025","platform":"win32","arch":"x64"}]}'
          else
            build_matrix='{"include":[{"id":"windows-x64","label":"Windows x64","runner":"windows-2025","platform":"win32","arch":"x64"},{"id":"windows-arm64","label":"Windows ARM64","runner":"windows-11-arm","platform":"win32","arch":"arm64"},{"id":"macos-arm64","label":"macOS Apple Silicon","runner":"macos-15","platform":"darwin","arch":"arm64"},{"id":"macos-x64","label":"macOS Intel","runner":"macos-15-intel","platform":"darwin","arch":"x64"},{"id":"linux-x64","label":"Linux x64","runner":"ubuntu-24.04","platform":"linux","arch":"x64"},{"id":"linux-arm64","label":"Linux ARM64","runner":"ubuntu-24.04-arm","platform":"linux","arch":"arm64"}]}'
          fi
          echo "build_matrix=$build_matrix" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Cài npm 12
        run: npm install --global npm@12

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.12.1'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Cài phụ thuộc từ lockfile
        uses: ./.github/actions/retry
        with:
          command: npm ci --no-audit --no-fund

      - name: Cài phụ thuộc Python kiểm thử từ lockfile
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra dev

      - name: Kiểm tra đầu vào runtime bất biến
        run: >-
          node --test
          scripts/vietnamese-release.test.mjs
          scripts/bundled-release-policy.test.mjs
          scripts/local-candidate-derived-outputs.test.mjs
          apps/desktop/scripts/patch-electron-builder-mac-binary.test.mjs
          apps/desktop/scripts/patch-electron-builder-windows-nsis.test.mjs
          scripts/validate-release-evidence.test.mjs
          scripts/validate-v321-promotion.test.mjs
          scripts/validate-pilot-release-evidence.test.mjs
          scripts/validate-public-release-contract.test.mjs
          scripts/prepare-agent-browser-native.test.mjs

      - name: Kiểm toán dependency runtime
        run: |
          npm audit --omit=dev --omit=optional --audit-level=high
          uv lock --check
          uv run python -c "import tomllib; from pathlib import Path; d=tomllib.loads(Path('pyproject.toml').read_text()); assert 'cryptography==50.0.0' in d['project']['dependencies']; text=Path('uv.lock').read_text(); assert 'name = \"cryptography\"' in text and 'version = \"50.0.0\"' in text"

      - name: Kiểm thử hợp đồng release và runtime
        run: >-
          npm run --prefix apps/desktop test:desktop:platforms --
          scripts/community-distribution.test.mjs
          scripts/collect-community-artifacts.test.mjs
          scripts/generate-community-update-metadata.test.mjs
          scripts/packaged-provenance.test.mjs
          scripts/packaged-layout.test.mjs
          scripts/release-workflow-contract.test.mjs
          scripts/stage-agent-payloads.test.mjs
          scripts/stage-native-deps.test.mjs
          scripts/verify-windows-nsis-provenance.test.mjs
          scripts/browser-connector-extension.test.mjs
          electron/app-updater.test.ts
          electron/active-runtime-state.test.ts
          electron/bootstrap-runner.test.ts
          electron/browser-connector/controller.test.ts
          electron/browser-connector/cookie-import.test.ts
          electron/browser-connector/pairing-server.test.ts
          electron/bundled-runtime.test.ts
          electron/connection-config.test.ts
          electron/connection-registry.test.ts
          electron/desktop-uninstall.test.ts
          electron/update-remote.test.ts

      - name: Kiểm thử plugin và tương thích dữ liệu cũ
        run: npm run --prefix apps/desktop check:test:plugins

      - name: Kiểm thử bề mặt Agents cố định
        run: >-
          npm run --prefix apps/desktop test:ui --
          src/app/chat/index.test.tsx
          src/app/chat/session-advisor-bar.test.tsx
          src/app/chat/session-gateway-control.test.tsx
          src/app/chat/session-drag.test.ts
          src/app/chat/session-tile-actions.test.ts
          src/app/chat/session-tile-attachments.test.tsx
          src/app/chat/session-tile-row.test.ts
          src/app/command-palette/contrib.test.ts
          src/app/contrib/hooks/use-quick-entry-bridge.test.ts
          src/app/contrib/hooks/use-session-tile-delegate.test.ts
          src/app/gateway/hooks/use-gateway-boot.test.tsx
          src/app/hooks/use-on-profile-switch.test.tsx
          src/app/hooks/use-config-record.test.ts
          src/app/session/hooks/use-session-actions.test.tsx
          src/app/settings/memory/provider-config-modal.test.tsx
          src/app/settings/memory/provider-config-panel.test.tsx
          src/app/settings/plugins-settings.test.tsx
          src/app/settings/providers-settings.test.tsx
          src/app/settings/terminal-font-setting.test.tsx
          src/app/settings/toolset-config-panel.test.tsx
          src/app/skills/index.test.tsx
          src/components/pane-shell/tree/legacy-agent-pane-migration.test.ts
          src/components/ui/dropdown-menu.test.tsx
          src/contrib/plugins-store.test.ts
          src/hermes-profile-scope.test.ts
          src/sdk/index.test.ts
          src/sdk/profile-routing.test.ts
          src/store/backend-owner.test.ts
          src/store/gateway-agent-scope.test.ts
          src/store/hub-actions.test.ts
          src/store/mcp-deeplink-install.test.ts
          src/store/mcp-health.test.ts
          src/store/onboarding.test.ts
          src/store/profile-share.test.ts
          src/store/profile-agent-activation.test.ts
          src/store/session-states.test.ts
          src/store/session-states-scopes.test.ts
          src/store/session-tile-owner.test.ts
          src/store/starmap.test.ts
          src/store/system-actions.test.ts
          src/store/suggestion-providers/mcp.test.ts
          src/store/suggestion-providers/repair.test.ts
          src/store/suggestion-providers/skill.test.ts
          src/store/voice-prefs.test.ts

      - name: Kiểm thử giao diện đã chốt
        run: >-
          npm run --prefix apps/desktop test:ui --
          src/app/chat/session-draft-title.test.tsx
          src/app/chat/sidebar/session-actions-menu.test.tsx
          src/app/chat/right-rail/preview-browser-fit.test.ts
          src/app/right-sidebar/index.test.tsx
          src/components/pane-shell/tree/renderer/track-model-absorber.test.ts
          src/components/first-run-journey.test.tsx
          src/components/onboarding/index.test.tsx
          src/i18n/vi-community.test.ts
          src/app/chat/right-rail/browser-connector-dialog.test.tsx
          src/app/chat/right-rail/preview-pane.test.tsx
          src/components/assistant-ui/thread/streaming.test.tsx
          src/store/reasoning-summary.test.ts

      - name: Kiểm thử giao diện Advisor và ngôn ngữ
        run: >-
          npm run --prefix apps/desktop test:ui --
          src/app/settings/model-settings.test.tsx
          src/app/settings/about-settings.test.tsx
          src/app/chat/session-advisor-bar.test.tsx
          src/app/shell/context-usage-panel.test.tsx
          src/app/chat/sidebar/project-dialog.test.tsx
          src/app/chat/sidebar/projects/project-menu.test.tsx
          src/app/projects/index.test.tsx
          src/app/routes.workspace-reveal.test.ts
          src/app/session/hooks/use-message-stream/work-progress-event.test.tsx
          src/app/usage/usage-overview.test.tsx
          src/components/assistant-ui/thread/status.test.tsx
          src/store/layout-right-sidebar.test.ts
          src/store/layout-pinned-order.test.ts
          src/store/layout-connection-scope.test.ts
          src/store/projects.test.ts
          src/lib/format.test.ts
          src/i18n/context.test.tsx
          src/i18n/languages.test.ts
          src/i18n/plugin-i18n.test.tsx

      - name: Kiểm tra lint Desktop
        run: npm run --prefix apps/desktop lint

      - name: Kiểm tra kiểu dữ liệu
        run: npm run --prefix apps/desktop typecheck

      - name: Kiểm thử Python liên quan phát hành
        run: >-
          ./scripts/run_tests.sh -q
          tests/scripts/test_write_install_stamp.py
          tests/test_release_node_floor_contract.py
          tests/test_install_sh_venv_transaction.py
          tests/hermes_cli/test_update_channel_stable.py
          tests/hermes_cli/test_update_eject.py
          tests/hermes_cli/test_version_info.py
          tests/hermes_cli/test_web_server_profile_unification.py
          tests/test_public_release_downloads.py
          tests/agent/test_oneshot.py
          tests/agent/test_advisor.py
          tests/agent/test_usage_pricing.py
          tests/run_agent/test_advisor_checkpoints.py
          tests/tui_gateway/test_advisor_session_scope.py
          tests/tui_gateway/test_profiles_create_credentials.py
          tests/tui_gateway/test_protocol.py
          tests/test_tui_gateway_server.py

  build:
    name: Dựng một lần — ${{ matrix.label }}
    needs: verify
    environment: release-signing
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.build_matrix) }}
    env:
      HERMES_DESKTOP_BUNDLED: '1'
      HERMES_PAYLOAD_TAG: ${{ needs.verify.outputs.tag }}
      HERMES_PAYLOAD_GIT_REF: ${{ needs.verify.outputs.commit }}
      HERMES_PAYLOAD_PYTHON: '3.11'
      HERMES_RELEASE_CLASS: ${{ needs.verify.outputs.release_class }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Xác minh đúng commit ứng viên
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Cài npm 12
        run: npm install --global npm@12

      - uses: actions/setup-python@e348410e00f449ece8581cb8e88be8f0e7712da6 # v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.12.1'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: matrix.id == 'windows-arm64'
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: matrix.id == 'macos-x64'
        with:
          toolchain: stable

      - name: Cài phụ thuộc từ lockfile
        uses: ./.github/actions/retry
        with:
          command: npm ci --no-audit --no-fund

      - name: Kiểm thử cleanup uninstaller trên runner Windows thật
        if: matrix.platform == 'win32'
        run: npm run --prefix apps/desktop test:desktop:platforms -- electron/desktop-uninstall.test.ts

      - name: Chuẩn bị OpenSSL ARM64 Windows
        if: matrix.id == 'windows-arm64'
        shell: bash
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install openssl:arm64-windows-static-md
          printf 'OPENSSL_DIR=C:\\vcpkg\\installed\\arm64-windows-static-md\nOPENSSL_STATIC=1\n' >> "$GITHUB_ENV"

      - name: Chuẩn bị OpenSSL bất biến cho macOS Intel
        if: matrix.id == 'macos-x64'
        shell: bash
        env:
          OPENSSL_VERSION: '3.5.7'
          OPENSSL_SHA256: 'a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8'
        run: |
          archive="$RUNNER_TEMP/openssl-$OPENSSL_VERSION.tar.gz"
          source_dir="$RUNNER_TEMP/openssl-$OPENSSL_VERSION"
          prefix="$RUNNER_TEMP/openssl-$OPENSSL_VERSION-install"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$archive" \
            "https://www.openssl.org/source/openssl-$OPENSSL_VERSION.tar.gz"
          printf '%s  %s\n' "$OPENSSL_SHA256" "$archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          (
            cd "$source_dir"
            ./Configure darwin64-x86_64-cc no-shared no-tests \
              --prefix="$prefix" --openssldir="$prefix/ssl"
            make -j"$(sysctl -n hw.ncpu)"
            make install_sw
          )
          printf 'OPENSSL_DIR=%s\nOPENSSL_STATIC=1\nPKG_CONFIG_PATH=%s/lib/pkgconfig\n' \
            "$prefix" "$prefix" >> "$GITHUB_ENV"

      - name: Bắt buộc cấu hình ký và công chứng Apple
        if: matrix.platform == 'darwin' && needs.verify.outputs.release_class == 'stable'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$CSC_LINK" || { echo "::error::MAC_CSC_LINK is missing"; exit 1; }
          test -n "$CSC_KEY_PASSWORD" || { echo "::error::MAC_CSC_KEY_PASSWORD is missing"; exit 1; }
          test -n "$APPLE_API_KEY" || { echo "::error::APPLE_API_KEY is missing"; exit 1; }
          test -n "$APPLE_API_KEY_ID" || { echo "::error::APPLE_API_KEY_ID is missing"; exit 1; }
          test -n "$APPLE_API_ISSUER" || { echo "::error::APPLE_API_ISSUER is missing"; exit 1; }

      - name: Dựng runtime và gói native
        shell: bash
        env:
          RELEASE_CLASS: ${{ needs.verify.outputs.release_class }}
          CSC_LINK: ${{ needs.verify.outputs.release_class == 'stable' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ needs.verify.outputs.release_class == 'stable' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ needs.verify.outputs.release_class == 'stable' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ needs.verify.outputs.release_class == 'stable' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ needs.verify.outputs.release_class == 'stable' && secrets.APPLE_API_ISSUER || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ needs.verify.outputs.release_class == 'stable' && 'true' || 'false' }}
          HERMES_PAYLOAD_BUILD_PYTHON: ${{ matrix.platform == 'win32' && 'python' || 'python3' }}
          HERMES_ALLOW_WIN32_ARM64_GET_WINDOWS_LIMITATION: ${{ matrix.id == 'windows-arm64' && needs.verify.outputs.release_class == 'community-prerelease' && '1' || '0' }}
        run: |
          if [ "$RELEASE_CLASS" != "stable" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          node scripts/build-bundled-desktop.mjs --tag="$HERMES_PAYLOAD_TAG" --no-install

      - name: Khóa đúng đường dẫn artifact vừa dựng
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          app_version="$(node --input-type=module -e 'import { parseVietnameseReleaseTag } from "./scripts/vietnamese-release.mjs"; console.log(parseVietnameseReleaseTag(process.argv[1]).appVersion)' "$HERMES_PAYLOAD_TAG")"
          case "$TARGET_PLATFORM:$TARGET_ARCH" in
            win32:*) artifact_name="Hermes-$app_version-win-$TARGET_ARCH.exe" ;;
            darwin:*) artifact_name="Hermes-$app_version-mac-$TARGET_ARCH.dmg" ;;
            linux:x64) artifact_name="Hermes-$app_version-linux-x86_64.AppImage" ;;
            linux:arm64) artifact_name="Hermes-$app_version-linux-arm64.AppImage" ;;
            *) echo "::error::Unsupported target $TARGET_PLATFORM-$TARGET_ARCH"; exit 1 ;;
          esac
          test -f "apps/desktop/release/$artifact_name" || {
            echo "::error::Missing exact distribution artifact: $artifact_name"
            exit 1
          }
          printf 'HERMES_DESKTOP_EXPECTED_ARTIFACT=release/%s\n' "$artifact_name" >> "$GITHUB_ENV"

      - name: Kiểm tra đúng payload đóng gói
        shell: bash
        env:
          HERMES_DESKTOP_SKIP_BUILD: '1'
        run: npm run --prefix apps/desktop test:desktop:all

      - name: Chuẩn hóa artifact
        run: >-
          node apps/desktop/scripts/collect-community-artifacts.mjs collect
          ${{ matrix.platform }} ${{ matrix.arch }} apps/desktop/release release-assets

      - name: Bắt buộc cấu hình SignPath cho Windows
        if: matrix.platform == 'win32' && needs.verify.outputs.release_class == 'stable'
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          test -n "$SIGNPATH_API_TOKEN" || { echo "::error::SIGNPATH_API_TOKEN is missing"; exit 1; }
          test -n "$SIGNPATH_ORGANIZATION_ID" || { echo "::error::SIGNPATH_ORGANIZATION_ID is missing"; exit 1; }
          test -n "$SIGNPATH_PROJECT_SLUG" || { echo "::error::SIGNPATH_PROJECT_SLUG is missing"; exit 1; }
          test -n "$SIGNPATH_SIGNING_POLICY_SLUG" || { echo "::error::SIGNPATH_SIGNING_POLICY_SLUG is missing"; exit 1; }
          test -n "$SIGNPATH_ARTIFACT_CONFIGURATION_SLUG" || { echo "::error::SIGNPATH_ARTIFACT_CONFIGURATION_SLUG is missing"; exit 1; }

      - name: Upload bộ cài Windows chưa ký cho SignPath
        id: upload-unsigned-windows
        if: matrix.platform == 'win32' && needs.verify.outputs.release_class == 'stable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ matrix.id }}-${{ needs.verify.outputs.commit }}
          path: release-assets/Hermes-Vietnamese-Windows-*-Setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Ký Authenticode bằng SignPath
        if: matrix.platform == 'win32' && needs.verify.outputs.release_class == 'stable'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
          skip-decompress: true
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed-windows

      - name: Thay bằng đúng byte đã ký và xác minh Authenticode
        if: matrix.platform == 'win32' && needs.verify.outputs.release_class == 'stable'
        shell: powershell
        run: |
          $expected = @(Get-ChildItem -LiteralPath release-assets -Filter 'Hermes-Vietnamese-Windows-*-Setup.exe')
          if ($expected.Count -ne 1) { throw "Expected one normalized Windows installer, found $($expected.Count)" }
          $signed = @(Get-ChildItem -LiteralPath signed-windows -Recurse -File -Filter $expected[0].Name)
          if ($signed.Count -ne 1) { throw "Expected one signed $($expected[0].Name), found $($signed.Count)" }
          Copy-Item -LiteralPath $signed[0].FullName -Destination $expected[0].FullName -Force
          $signature = Get-AuthenticodeSignature -LiteralPath $expected[0].FullName
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
            throw "Signed installer Authenticode is $($signature.Status), not Valid"
          }

      - name: Ghi giới hạn build-only Windows ARM64
        if: matrix.id == 'windows-arm64' && needs.verify.outputs.release_class == 'community-prerelease'
        shell: bash
        run: |
          cat > release-assets/limitations-windows-arm64.txt <<'EOF'
          release_class=community-prerelease
          support_scope=build-only-pilot
          read_window_below=unavailable
          reason=get-windows-9.3.0-has-no-win32-arm64-native-binding
          stable_eligible=false
          EOF

      - name: Xác minh provenance trong đúng byte Windows sau ký
        if: matrix.platform == 'win32'
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          installers=(release-assets/Hermes-Vietnamese-Windows-"$TARGET_ARCH"-Setup.exe)
          test "${#installers[@]}" -eq 1 && test -f "${installers[0]}" || {
            echo "::error::Expected one normalized Windows $TARGET_ARCH installer"
            exit 1
          }
          node apps/desktop/scripts/verify-windows-nsis-provenance.mjs \
            "${installers[0]}" --arch="$TARGET_ARCH"

      - name: Ghi lại checksum sau ký
        run: >-
          node apps/desktop/scripts/collect-community-artifacts.mjs checksums
          release-assets SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt

      - name: Ghi trạng thái ký/công chứng
        shell: bash
        run: |
          mkdir -p release-assets
          {
            echo "tag=$HERMES_PAYLOAD_TAG"
            echo "commit=${{ needs.verify.outputs.commit }}"
            echo "platform=${{ matrix.platform }}"
            echo "arch=${{ matrix.arch }}"
            echo "release_class=$HERMES_RELEASE_CLASS"
            if [[ "${{ matrix.platform }}" == "win32" ]]; then
              powershell.exe -NoProfile -Command "Get-ChildItem release-assets/*.exe | ForEach-Object { \$signature = Get-AuthenticodeSignature -LiteralPath \$_.FullName; Write-Output ('authenticode_status=' + [string]\$signature.Status); Write-Output ('signer_present=' + [string]([bool](\$null -ne \$signature.SignerCertificate)).ToString().ToLowerInvariant()); \$signature | Select-Object Path,Status,StatusMessage,SignerCertificate | ConvertTo-Json -Depth 4 }"
            elif [[ "${{ matrix.platform }}" == "darwin" && "$HERMES_RELEASE_CLASS" == "stable" ]]; then
              codesign --verify --deep --strict --verbose=2 apps/desktop/release/mac*/Hermes.app 2>&1
              spctl --assess --type execute --verbose=4 apps/desktop/release/mac*/Hermes.app 2>&1
              xcrun stapler validate apps/desktop/release/mac*/Hermes.app 2>&1
            elif [[ "${{ matrix.platform }}" == "darwin" ]]; then
              echo "signing=unsigned-community-prerelease"
              codesign --display --verbose=4 apps/desktop/release/mac*/Hermes.app 2>&1 || true
              spctl --assess --type execute --verbose=4 apps/desktop/release/mac*/Hermes.app 2>&1 || true
              xcrun stapler validate apps/desktop/release/mac*/Hermes.app 2>&1 || true
            else
              echo "signing=sha256-only"
            fi
          } > "release-assets/signing-${{ matrix.id }}.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-vietnamese-${{ matrix.id }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  stage:
    name: Upload đúng byte vào draft
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Tải lại tag staging với retry giới hạn
        uses: ./.github/actions/retry
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        with:
          command: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          attempts: '5'
          delay: '15'

      - name: Khóa lại tag và commit trước staging
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          head_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n 1 "$TAG")"
          test "$head_commit" = "$EXPECTED_COMMIT" || { echo "::error::stage checkout is $head_commit, expected $EXPECTED_COMMIT"; exit 1; }
          test "$tag_commit" = "$EXPECTED_COMMIT" || { echo "::error::fresh tag $TAG points to $tag_commit, expected $EXPECTED_COMMIT"; exit 1; }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hermes-vietnamese-*
          path: release-assets
          merge-multiple: true

      - name: Lập metadata cập nhật theo đúng artifact đã dựng
        if: needs.verify.outputs.release_class == 'stable'
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: >-
          node apps/desktop/scripts/generate-community-update-metadata.mjs
          release-assets "$TAG" "$(git show -s --format=%cI "$COMMIT")" stable

      - name: Chặn feed cập nhật cho community prerelease chưa ký
        if: needs.verify.outputs.release_class == 'community-prerelease'
        shell: bash
        run: |
          shopt -s nullglob
          feeds=(release-assets/latest*.yml)
          if (( ${#feeds[@]} != 0 )); then
            printf '::error::community-prerelease must not publish stable update metadata: %s\n' "${feeds[*]}"
            exit 1
          fi

      - name: Lập manifest SHA-256 và provenance
        shell: bash
        run: |
          node apps/desktop/scripts/collect-community-artifacts.mjs checksums release-assets SHA256SUMS.txt
          node -e "const fs=require('fs'); fs.writeFileSync('release-assets/candidate-provenance.json', JSON.stringify({tag:process.env.TAG,commit:process.env.COMMIT,releaseClass:process.env.RELEASE_CLASS,runId:process.env.RUN_ID,workflow:process.env.WORKFLOW},null,2)+'\n')"
          (cd release-assets && sha256sum candidate-provenance.json >> SHA256SUMS.txt)
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ needs.verify.outputs.commit }}
          RELEASE_CLASS: ${{ needs.verify.outputs.release_class }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}

      - name: Tạo draft mới, tuyệt đối không public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_CLASS: ${{ needs.verify.outputs.release_class }}
          RELEASE_TITLE: ${{ needs.verify.outputs.release_title }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; use a new candidate tag instead of replacing accepted bytes"
            exit 1
          fi
          if [[ "$RELEASE_CLASS" == "community-prerelease" ]]; then
            gh release create "$TAG" --verify-tag --draft --prerelease --title "$RELEASE_TITLE" --notes-file .github/release-notes-vietnamese.md
          else
            gh release create "$TAG" --verify-tag --draft --title "$RELEASE_TITLE" --notes-file .github/release-notes-vietnamese.md
          fi
          gh release upload "$TAG" release-assets/*

      - name: Tải lại và đối chiếu byte đã staging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_CLASS: ${{ needs.verify.outputs.release_class }}
        run: |
          mkdir uploaded
          gh release download "$TAG" --dir uploaded
          cp uploaded/SHA256SUMS.txt uploaded/SHA256SUMS.verify
          cd uploaded
          sha256sum --check SHA256SUMS.verify
          release_json="$(gh release view "$TAG" --json isDraft,isPrerelease)"
          test "$(jq -r .isDraft <<<"$release_json")" = "true"
          expected_prerelease=false
          [[ "$RELEASE_CLASS" == "community-prerelease" ]] && expected_prerelease=true
          test "$(jq -r .isPrerelease <<<"$release_json")" = "$expected_prerelease"
