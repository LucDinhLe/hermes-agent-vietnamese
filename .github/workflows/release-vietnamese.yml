name: Phát hành Hermes tiếng Việt đa nền tảng

on:
  push:
    tags:
      - 'vi-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Nhãn phát hành, ví dụ vi-v0.20.0-4'
        required: true
        type: string
      prerelease:
        description: 'Đánh dấu là bản thử nghiệm'
        default: true
        required: true
        type: boolean

concurrency:
  group: hermes-vietnamese-release-${{ github.ref }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Kiểm tra mã nguồn và hợp đồng phát hành
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: 24
          cache: npm

      - name: Cài npm 12
        run: npm install --global npm@12

      - name: Cài phụ thuộc
        uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Kiểm toán thư viện đi vào ứng dụng
        run: npm audit --omit=optional --audit-level=high

      - name: Kiểm thử hợp đồng phân phối cộng đồng
        run: >-
          npm run --prefix apps/desktop test:desktop:platforms --
          scripts/community-distribution.test.mjs
          scripts/collect-community-artifacts.test.mjs
          scripts/packaged-layout.test.mjs
          electron/bootstrap-runner.test.ts
          electron/update-remote.test.ts

      - name: Kiểm thử giao diện và ngôn ngữ
        run: >-
          npm run --prefix apps/desktop test:ui --
          src/i18n/languages.test.ts
          src/i18n/context.test.tsx
          src/components/first-run-journey.test.tsx
          src/components/desktop-install-overlay.test.tsx
          src/components/onboarding/index.test.tsx
          src/components/bilingual-quick-toggle.test.tsx
          src/app/chat/session-draft-title.test.tsx

      - name: Kiểm tra kiểu dữ liệu
        run: npm run --prefix apps/desktop typecheck

  build:
    name: Đóng gói ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            label: Windows x64
            runner: windows-2025
            platform: win32
            arch: x64
            command: dist:win:x64
          - id: windows-arm64
            label: Windows ARM64
            runner: windows-11-arm
            platform: win32
            arch: arm64
            command: dist:win:arm64
          - id: macos-arm64
            label: macOS Apple Silicon
            runner: macos-15
            platform: darwin
            arch: arm64
            command: dist:mac:arm64
          - id: macos-x64
            label: macOS Intel
            runner: macos-15-intel
            platform: darwin
            arch: x64
            command: dist:mac:x64
          - id: linux-x64
            label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            command: dist:linux:x64
          - id: linux-arm64
            label: Linux ARM64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            command: dist:linux:arm64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: 24
          cache: npm

      - name: Cài npm 12
        run: npm install --global npm@12

      - name: Cài phụ thuộc đúng kiến trúc
        uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Kiểm thử đường đóng gói theo hệ điều hành
        run: >-
          npm run --prefix apps/desktop test:desktop:platforms --
          electron/bootstrap-runner.test.ts
          electron/update-remote.test.ts

      - name: Kiểm tra trình cài runtime Windows
        if: matrix.platform == 'win32'
        shell: powershell
        run: |
          $manifest = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -Manifest | Select-Object -Last 1 | ConvertFrom-Json
          if ($manifest.protocol_version -ne 1 -or $manifest.stages.Count -lt 1) { throw 'Invalid Windows bootstrap manifest' }

      - name: Kiểm tra trình cài runtime macOS và Linux
        if: matrix.platform != 'win32'
        shell: bash
        run: |
          manifest="$(bash scripts/install.sh --manifest)"
          node -e 'const m=JSON.parse(process.argv[1]); if(m.protocol_version!==1 || !m.stages?.length) process.exit(1)' "$manifest"

      - name: Đóng gói Windows hoặc Linux
        if: matrix.platform != 'darwin'
        run: npm run --prefix apps/desktop ${{ matrix.command }}

      - name: Đóng gói macOS
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ -z "${CSC_LINK:-}" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run --prefix apps/desktop ${{ matrix.command }}

      - name: Kiểm tra cấu trúc gói đã đóng
        env:
          HERMES_DESKTOP_SKIP_BUILD: '1'
        run: npm run --prefix apps/desktop test:desktop:all

      - name: Chuẩn hóa tên tệp và tạo mã SHA-256
        run: >-
          node apps/desktop/scripts/collect-community-artifacts.mjs collect
          ${{ matrix.platform }}
          ${{ matrix.arch }}
          apps/desktop/release
          release-assets

      - name: Lưu bản dựng
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: hermes-vietnamese-${{ matrix.id }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Gom gói và tạo GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24

      - name: Tải toàn bộ gói cài
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node 24
        with:
          pattern: hermes-vietnamese-*
          path: release-assets
          merge-multiple: true

      - name: Tạo bảng SHA-256 chung
        run: node apps/desktop/scripts/collect-community-artifacts.mjs checksums release-assets SHA256SUMS.txt

      - name: Xác định nhãn phát hành
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$REF_NAME"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          fi
          if [[ ! "$tag" =~ ^vi-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "Nhãn không hợp lệ: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Tạo hoặc cập nhật GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" != "true" ]]; then
              echo "Bản phát hành $RELEASE_TAG đã công bố. Hãy dùng nhãn mới; không ghi đè tệp đã công bố." >&2
              exit 1
            fi

            echo "Tiếp tục bản nháp $RELEASE_TAG còn dang dở."
            gh release edit "$RELEASE_TAG" --target "${{ github.sha }}"
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --title "Hermes tiếng Việt $RELEASE_TAG" \
              --notes-file .github/release-notes-vietnamese.md \
              --target "${{ github.sha }}"
          fi

          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > existing-assets.txt
          for asset in release-assets/*; do
            name="$(basename "$asset")"
            if grep -Fxq "$name" existing-assets.txt; then
              echo "Đã có $name; bỏ qua tải lại."
              continue
            fi
            gh release upload "$RELEASE_TAG" "$asset"
          done

          publish_flags=(--draft=false)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$PRERELEASE" == "true" ]]; then
            publish_flags+=(--prerelease)
          fi

          gh release edit "$RELEASE_TAG" "${publish_flags[@]}"
