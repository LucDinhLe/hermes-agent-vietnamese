name: Validate Hermes Vietnamese V33

on:
  pull_request:
  push:
    branches:
      - main
      - v33/composite-shell
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v33-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 source and build gates
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Check out Vietnamese shell
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read locked upstream ref
        id: engine
        shell: pwsh
        run: |
          $lock = Get-Content -LiteralPath 'engine.lock.json' -Raw | ConvertFrom-Json
          "tag=$($lock.source.tag)" >> $env:GITHUB_OUTPUT
          "commit=$($lock.source.commit)" >> $env:GITHUB_OUTPUT

      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out locked Hermes engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.engine.outputs.tag }}
          fetch-depth: 0
          path: .work/upstream
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26

      - name: Verify shell contracts
        shell: pwsh
        run: |
          npm ci
          npm test
          npm run verify

      - name: Materialize exact edition tree
        id: materialize
        shell: pwsh
        run: >-
          npm run materialize --
          --engine-dir "$env:GITHUB_WORKSPACE\.work\upstream"
          --output "$env:GITHUB_WORKSPACE\.work\materialized"

      - name: Install locked engine dependencies
        id: install
        working-directory: .work/materialized
        shell: pwsh
        run: npm ci

      - name: Typecheck desktop
        working-directory: .work/materialized
        shell: pwsh
        run: npm run typecheck --workspace apps/desktop

      - name: Lint desktop
        working-directory: .work/materialized
        shell: pwsh
        run: npm run lint --workspace apps/desktop

      - name: Test Vietnamese renderer surfaces
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: .work/materialized/apps/desktop
        shell: pwsh
        run: >-
          npm exec -- vitest run --project ui
          src/i18n/vi-community.test.ts
          src/plugins/hermes-vietnamese/plugin.test.tsx
          src/plugins/hermes-vietnamese/support-report.test.ts
          --maxWorkers=1

      - name: Test dormant Vietnamese identity migration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: .work/materialized/apps/desktop
        shell: pwsh
        run: >-
          npm exec -- vitest run --project electron
          electron/vietnamese-identity-migration.test.ts
          --maxWorkers=1

      - name: Test bundled plugins
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: .work/materialized
        shell: pwsh
        run: npm run check:test:plugins --workspace apps/desktop

      - name: Test renderer
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: .work/materialized
        shell: pwsh
        run: npm run test:ui --workspace apps/desktop

      - name: Install pristine upstream dependencies
        id: upstream_install
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: .work/upstream
        shell: pwsh
        run: npm ci

      - name: Test Electron platform code in pristine upstream before V33
        id: electron_upstream_before
        if: ${{ !cancelled() && steps.upstream_install.outcome == 'success' }}
        continue-on-error: true
        working-directory: .work/upstream
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\.work\evidence" | Out-Null
          $env:NO_COLOR = '1'
          npm run test:desktop:platforms --workspace apps/desktop 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE\.work\evidence\upstream-electron-before.log"
          $exitCode = $LASTEXITCODE
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          exit $exitCode

      - name: Test Electron platform code in V33
        id: electron_candidate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        working-directory: .work/materialized
        shell: pwsh
        run: |
          $env:NO_COLOR = '1'
          npm run test:desktop:platforms --workspace apps/desktop 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE\.work\evidence\v33-electron.log"
          $exitCode = $LASTEXITCODE
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          exit $exitCode

      - name: Test Electron platform code in pristine upstream after V33
        id: electron_upstream_after
        if: ${{ !cancelled() && steps.upstream_install.outcome == 'success' }}
        continue-on-error: true
        working-directory: .work/upstream
        shell: pwsh
        run: |
          $env:NO_COLOR = '1'
          npm run test:desktop:platforms --workspace apps/desktop 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE\.work\evidence\upstream-electron-after.log"
          $exitCode = $LASTEXITCODE
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          exit $exitCode

      - name: Verify pristine upstream source remained clean
        if: ${{ !cancelled() && steps.upstream_install.outcome == 'success' }}
        working-directory: .work/upstream
        shell: pwsh
        run: git diff --exit-code

      - name: Compare Electron failures against pristine upstream
        if: >-
          ${{ !cancelled() &&
              steps.install.outcome == 'success' &&
              steps.upstream_install.outcome == 'success' }}
        shell: pwsh
        run: >-
          node scripts/compare-electron-baseline.mjs
          --candidate-log ".work/evidence/v33-electron.log"
          --candidate-exit "${{ steps.electron_candidate.outputs.exit_code }}"
          --upstream-log ".work/evidence/upstream-electron-before.log"
          --upstream-exit "${{ steps.electron_upstream_before.outputs.exit_code }}"
          --upstream-log ".work/evidence/upstream-electron-after.log"
          --upstream-exit "${{ steps.electron_upstream_after.outputs.exit_code }}"
          --output ".work/evidence/electron-baseline-comparison.json"

      - name: Verify immutable materialized inputs before build
        id: verify_materialized
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: pwsh
        run: |
          npm run verify:materialized -- --tree ".work/materialized" --shell-commit "$env:GITHUB_SHA" --require-clean-shell
          $receiptSha = (Get-FileHash ".work/materialized/apps/desktop/build/edition-receipt.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          "receipt_sha=$receiptSha" >> $env:GITHUB_OUTPUT

      - name: Build desktop once for diagnostic evidence
        id: build
        if: >-
          ${{ !cancelled() &&
              steps.materialize.outcome == 'success' &&
              steps.install.outcome == 'success' &&
              steps.verify_materialized.outcome == 'success' }}
        working-directory: .work/materialized
        shell: pwsh
        run: |
          Remove-Item Env:GITHUB_SHA -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_REF_NAME -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_HEAD_REF -ErrorAction SilentlyContinue
          npm run build --workspace apps/desktop

      - name: Verify build stamp against immutable receipt
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: >-
          npm run verify:provenance --
          --resources ".work/materialized/apps/desktop/build"
          --shell-commit "$env:GITHUB_SHA"
          --receipt-sha256 "${{ steps.verify_materialized.outputs.receipt_sha }}"
          --require-clean-shell

      - name: Upload immutable build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v33-windows-x64-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .work/materialized/apps/desktop/build/edition-receipt.json
            .work/materialized/apps/desktop/build/install-stamp.json
            .work/evidence/v33-electron.log
            .work/evidence/upstream-electron-before.log
            .work/evidence/upstream-electron-after.log
            .work/evidence/electron-baseline-comparison.json
