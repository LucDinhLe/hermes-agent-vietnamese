name: Dựng bản thử nghiệm (kênh thunghiem)

# Workflow tối giản cho kênh thử nghiệm của kế hoạch composite (04/09/2026).
# Tách hoàn toàn khỏi release-vietnamese.yml và các cổng promote của bản Latest:
# - chỉ nhận tag vYYYY.M.D-thunghiem.N
# - luôn tạo GitHub Release đánh dấu pre-release, không bao giờ đổi Latest
# - không ký số, không đụng .github/public-release.json trên main
# - ghi feed kênh thử nghiệm lên nhánh mồ côi feed/thunghiem để
#   electron/release-notice.ts báo bản mới cho người dùng bản thử nghiệm

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*-thunghiem.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag thử nghiệm đã tồn tại, ví dụ v2026.9.3-thunghiem.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: build-thunghiem-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Windows x64, chưa ký số
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      HERMES_DESKTOP_BUNDLED: '1'
      HERMES_PAYLOAD_TAG: ${{ inputs.tag || github.ref_name }}
      HERMES_PAYLOAD_PYTHON: '3.11'
      HERMES_RELEASE_CLASS: community-prerelease
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Kiểm tag đúng dạng thử nghiệm và trỏ HEAD
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,3}-thunghiem\.[0-9]{1,4}$ ]] || { echo "::error::tag $RELEASE_TAG không phải dạng vYYYY.M.D-thunghiem.N"; exit 1; }
          test "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" = "$(git rev-parse HEAD)" || { echo "::error::tag không trỏ vào checkout"; exit 1; }
          echo "HERMES_PAYLOAD_GIT_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Cài npm 12
        run: npm install --global npm@12

      - uses: actions/setup-python@e348410e00f449ece8581cb8e88be8f0e7712da6 # v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.12.1'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Lõi phải khớp engine.lock
        run: node scripts/engine-sync.mjs check

      - name: Cài phụ thuộc từ lockfile
        uses: ./.github/actions/retry
        with:
          command: npm ci --no-audit --no-fund

      - name: Kiểm thử cleanup uninstaller trên Windows thật
        run: npm run --prefix apps/desktop test:desktop:platforms -- electron/desktop-uninstall.test.ts electron/release-notice.test.ts

      - name: Cây làm việc phải sạch trước khi dựng (in ra rồi dọn tệp phụ của bước cài/test)
        shell: bash
        run: |
          # Upstream có hai tệp chỉ khác nhau chữ hoa/thường (contributors/emails/agent@Agents-Mac-mini.local
          # và agent@agents-Mac-mini.local); Windows không phân biệt nên luôn báo "modified".
          # Đánh dấu skip-worktree để git status và build script bỏ qua; nội dung lõi không đổi.
          git ls-files contributors/emails | grep -i 'agents-mac-mini' | while read -r f; do git update-index --skip-worktree -- "$f"; done
          git status --porcelain=v1 --untracked-files=normal | tee /tmp/status-before.txt
          if [ -s /tmp/status-before.txt ]; then
            echo "::warning::npm ci / vitest để lại thay đổi ở trên; khôi phục tệp theo dõi và xoá tệp lạ (không đụng tệp bị ignore như node_modules)"
            git checkout -- .
            git clean -fdq
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"

      - name: Dựng runtime và bộ cài NSIS
        shell: bash
        env:
          HERMES_PAYLOAD_BUILD_PYTHON: python
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          export GITHUB_SHA="$HERMES_PAYLOAD_GIT_REF"
          node scripts/build-bundled-desktop.mjs --tag="$RELEASE_TAG" --no-install -- --publish never

      - name: Băm và ghi feed kênh thử nghiệm
        id: assets
        shell: bash
        run: |
          app_version="${RELEASE_TAG#v}"
          exe="apps/desktop/release/Hermes-$app_version-win-x64.exe"
          test -f "$exe" || { echo "::error::không thấy $exe"; ls apps/desktop/release; exit 1; }
          mkdir -p out
          cp "$exe" out/
          ( cd out && sha256sum "Hermes-$app_version-win-x64.exe" > SHA256SUMS.txt )
          size="$(stat -c %s "$exe")"
          sha="$(cut -d' ' -f1 out/SHA256SUMS.txt)"
          cat > out/public-release-thunghiem.json <<EOF
          {
            "channel": "thunghiem",
            "tag": "$RELEASE_TAG",
            "version": "$app_version",
            "releaseClass": "community-pilot",
            "updateFeedEnabled": true,
            "sourceCommit": "$HERMES_PAYLOAD_GIT_REF",
            "engine": $(node -e 'const l=require("./engine.lock");console.log(JSON.stringify({tag:l.engine.tag,commit:l.engine.commit}))'),
            "supportedTargets": ["windows-x64"],
            "windowsX64": { "filename": "Hermes-$app_version-win-x64.exe", "size": $size, "sha256": "$sha", "authenticode": "NotSigned" },
            "rollback": "Bản chính v2026.9.2 không bị đụng; gỡ bản thử nghiệm là quay lui."
          }
          EOF
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "exe=Hermes-$app_version-win-x64.exe" >> "$GITHUB_OUTPUT"
          cat out/public-release-thunghiem.json

      - name: Ghi chú phát hành
        shell: bash
        run: |
          engine_tag="$(node -e 'console.log(require("./engine.lock").engine.tag)')"
          cat > out/NOTES.md <<EOF
          ## Hermes Vietnamese ${RELEASE_TAG} · bản thử nghiệm

          Đây là **bản thử nghiệm cộng đồng (pre-release), chưa ký số, chưa phải Latest**. Bản chính vẫn là v2026.9.2.

          Bản này cài **cạnh** bản Hermes đang có, dùng thư mục dữ liệu riêng (\`%LOCALAPPDATA%\\hermes-vietnamese\`), shortcut "Hermes Vietnamese (thử nghiệm)" và mục gỡ cài đặt riêng. Bản cũ và dữ liệu của nó không bị đụng. Muốn quay lui, gỡ bản thử nghiệm.

          Điểm mới về kiến trúc: lõi là Hermes Agent **${engine_tag}** nguyên bản của Nous Research (ghim trong \`engine.lock\`), giao diện Việt giữ nguyên, cập nhật kiểu **chỉ báo**: ứng dụng báo bản mới kèm SHA-256, không tự tải hay tự cài.

          Hạn chế đã biết của bản thử nghiệm 1: tạm ẩn Hồ sơ công việc, gợi ý kỹ năng theo công việc, bảng phân công MCP và ngân sách lượt (sẽ về dưới dạng plugin); không còn các vá lõi riêng về SQLite busy-retry, thăm dò Bedrock và ngưỡng nén Codex.

          Tệp: \`${{ steps.assets.outputs.exe }}\` · ${{ steps.assets.outputs.size }} byte
          SHA-256: \`${{ steps.assets.outputs.sha }}\`

          Windows có thể cảnh báo vì bộ cài chưa ký số. Đối chiếu SHA-256 trước khi chạy.
          EOF

      - name: Tạo pre-release trên GitHub (không đổi Latest)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" out/*.exe out/SHA256SUMS.txt out/public-release-thunghiem.json --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease --notes-file out/NOTES.md
          else
            gh release create "$RELEASE_TAG" out/*.exe out/SHA256SUMS.txt out/public-release-thunghiem.json \
              --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Hermes Vietnamese $RELEASE_TAG (thử nghiệm)" --notes-file out/NOTES.md
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease,isLatest -q '"prerelease=\(.isPrerelease) latest=\(.isLatest)"'
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isLatest -q .isLatest)" = "false" || { echo "::error::pre-release lại thành Latest"; exit 1; }

      - name: Cập nhật feed kênh thử nghiệm (nhánh feed/thunghiem)
        shell: bash
        run: |
          git config user.name "hermes-vietnamese-ci"
          git config user.email "LucDinhLe@users.noreply.github.com"
          if git fetch origin feed/thunghiem 2>/dev/null; then
            git worktree add feedwt FETCH_HEAD
          else
            git worktree add --detach feedwt
            ( cd feedwt && git checkout --orphan feed/thunghiem && git rm -rfq . && git clean -fdxq )
          fi
          cp out/public-release-thunghiem.json feedwt/public-release-thunghiem.json
          ( cd feedwt && git add public-release-thunghiem.json && git -c commit.gpgsign=false commit -q -m "feed(thunghiem): $RELEASE_TAG" && git push origin HEAD:refs/heads/feed/thunghiem )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-thunghiem-${{ env.RELEASE_TAG }}-win-x64
          path: out/
          if-no-files-found: error
