name: Công khai Hermes Vietnamese đã nghiệm thu

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Draft đã nghiệm thu, ví dụ vi-v0.20.0-15'
        required: true
        type: string
      sha256sums_sha256:
        description: 'SHA-256 của chính tệp SHA256SUMS.txt đã nghiệm thu'
        required: true
        type: string
      runtime_smoke_run_id:
        description: 'Run ID workflow runtime-smoke đã GO trên đúng artifact'
        required: true
        type: string
      release_class:
        description: 'Stable bắt buộc ký; community-prerelease luôn giữ nhãn prerelease'
        required: true
        type: choice
        options:
          - community-prerelease
          - stable

concurrency:
  group: hermes-vietnamese-promotion
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  promote:
    name: Kiểm gate và chuyển chính draft thành public
    runs-on: ubuntu-24.04
    environment: release-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.tag }}

      - name: Xác minh draft, manifest và runtime-smoke
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EXPECTED_MANIFEST_SHA: ${{ inputs.sha256sums_sha256 }}
          SMOKE_RUN_ID: ${{ inputs.runtime_smoke_run_id }}
          RELEASE_CLASS: ${{ inputs.release_class }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^vi-v(0|[1-9][0-9]{0,2})\.[0-9]+\.[0-9]+-(0|[1-9][0-9]*)$ ]]
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --slurp > release-pages.json
          jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)]' \
            release-pages.json > release-matches.json
          test "$(jq 'length' release-matches.json)" = "1"
          jq '.[0]' release-matches.json > release-api.json
          release_id="$(jq -r .id release-api.json)"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          test "$(jq -r .tag_name release-api.json)" = "$TAG"
          test "$(jq -r .draft release-api.json)" = "true"
          expected_draft_prerelease=false
          [[ "$RELEASE_CLASS" == "community-prerelease" ]] && expected_draft_prerelease=true
          test "$(jq -r .prerelease release-api.json)" = "$expected_draft_prerelease"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --slurp > release-asset-pages.json
          jq --slurpfile asset_pages release-asset-pages.json \
            '.assets = [$asset_pages[0][][]]' release-api.json > release-api-complete.json
          mv release-api-complete.json release-api.json
          jq '{isDraft: .draft, isPrerelease: .prerelease, name, body}' \
            release-api.json > candidate-release.json
          TAG="$TAG" RELEASE_CLASS="$RELEASE_CLASS" \
            RELEASE_JSON_PATH=candidate-release.json node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import {
            resolveVietnameseReleaseCandidate,
            validateFeaturedCandidatePromotion,
            validateVietnameseReleaseNotesForClass,
            validateVietnameseReleasePresentation,
          } from './scripts/vietnamese-release.mjs'

          const release = JSON.parse(fs.readFileSync(process.env.RELEASE_JSON_PATH, 'utf8'))
          const candidate = resolveVietnameseReleaseCandidate(process.env.TAG)
          if (process.env.RELEASE_CLASS === 'community-prerelease') {
            const publicRelease = JSON.parse(fs.readFileSync('.github/public-release.json', 'utf8'))
            validateFeaturedCandidatePromotion({
              featuredCandidate: publicRelease.featuredCandidate,
              tag: process.env.TAG,
            })
          }
          const expectedBody = fs.readFileSync('.github/release-notes-vietnamese.md', 'utf8')
          validateVietnameseReleaseNotesForClass({
            body: expectedBody,
            releaseClass: process.env.RELEASE_CLASS,
          })
          validateVietnameseReleasePresentation({
            body: release.body,
            expectedBody,
            expectedTitle: candidate.releaseTitle,
            name: release.name,
          })
          NODE
          mkdir candidate
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir candidate
          TAG="$TAG" REPOSITORY="$GITHUB_REPOSITORY" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { createReadStream, readdirSync, statSync } from 'node:fs'
          import { readFile } from 'node:fs/promises'

          const api = JSON.parse(await readFile('release-api.json', 'utf8'))
          const draftPage = new URL(api.html_url)
          const draftPagePrefix = `/${process.env.REPOSITORY}/releases/tag/`
          const draftPageRoute = decodeURIComponent(draftPage.pathname.slice(draftPagePrefix.length))
          if (
            draftPage.origin !== 'https://github.com' ||
            !draftPage.pathname.startsWith(draftPagePrefix) ||
            !/^untagged-[0-9a-f]+$/u.test(draftPageRoute)
          ) {
            throw new Error(`draft release page URL mismatch: ${api.html_url}`)
          }
          const local = readdirSync('candidate').sort()
          const remote = api.assets.map(asset => asset.name).sort()
          if (new Set(remote).size !== remote.length) throw new Error('draft asset names are not unique')
          if (JSON.stringify(local) !== JSON.stringify(remote)) throw new Error('draft asset inventory mismatch')
          for (const asset of api.assets) {
            const file = `candidate/${asset.name}`
            if (asset.size !== statSync(file).size) throw new Error(`asset size mismatch: ${asset.name}`)
            const hash = createHash('sha256')
            for await (const chunk of createReadStream(file)) hash.update(chunk)
            const digest = `sha256:${hash.digest('hex')}`
            if (asset.digest !== digest) throw new Error(`asset digest mismatch: ${asset.name}`)
            const download = new URL(asset.browser_download_url)
            const downloadPrefix = `/${process.env.REPOSITORY}/releases/download/`
            const downloadRoute = download.pathname.slice(downloadPrefix.length)
            const separator = downloadRoute.indexOf('/')
            const releaseRoute = decodeURIComponent(downloadRoute.slice(0, separator))
            const assetRoute = decodeURIComponent(downloadRoute.slice(separator + 1))
            if (
              download.origin !== 'https://github.com' ||
              !download.pathname.startsWith(downloadPrefix) ||
              separator < 1 ||
              (releaseRoute !== process.env.TAG && !/^untagged-[0-9a-f]+$/u.test(releaseRoute)) ||
              assetRoute !== asset.name
            ) {
              throw new Error(`draft asset URL shape mismatch: ${asset.name}`)
            }
          }
          NODE
          node scripts/release-asset-inventory.mjs candidate release-runtime-evidence.json > /dev/null
          actual_manifest_sha="$(sha256sum candidate/SHA256SUMS.txt | cut -d' ' -f1)"
          test "$actual_manifest_sha" = "$EXPECTED_MANIFEST_SHA"
          cd candidate
          sha256sum --check SHA256SUMS.txt
          cd ..
          RELEASE_CLASS="$RELEASE_CLASS" node -e "const p=require('./candidate/candidate-provenance.json'); if(p.releaseClass!==process.env.RELEASE_CLASS) process.exit(1)"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SMOKE_RUN_ID")"
          test "$(jq -r .name <<<"$run_json")" = "Kiểm thử runtime artifact Hermes Vietnamese"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          candidate_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          test "$(git rev-parse HEAD)" = "$candidate_commit"
          tag_ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          tag_ref_type="$(jq -r .object.type <<<"$tag_ref_json")"
          tag_ref_object="$(jq -r .object.sha <<<"$tag_ref_json")"
          [[ "$tag_ref_type" == "tag" || "$tag_ref_type" == "commit" ]]
          [[ "$tag_ref_object" =~ ^[0-9a-f]{40}$ ]]
          [[ "$candidate_commit" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$tag_ref_type" == "tag" ]]; then
            tag_object_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_ref_object")"
            test "$(jq -r .sha <<<"$tag_object_json")" = "$tag_ref_object"
            test "$(jq -r .object.type <<<"$tag_object_json")" = "commit"
            test "$(jq -r .object.sha <<<"$tag_object_json")" = "$candidate_commit"
          else
            test "$tag_ref_object" = "$candidate_commit"
          fi
          jq -n \
            --arg refType "$tag_ref_type" \
            --arg refObject "$tag_ref_object" \
            --arg peeledCommit "$candidate_commit" \
            '{refType: $refType, refObject: $refObject, peeledCommit: $peeledCommit}' \
            > candidate-tag-binding.json
          public_tag="$(node -p "require('./.github/public-release.json').tag")"
          if [[ "$RELEASE_CLASS" == "stable" ]]; then
            test "$public_tag" = "$TAG"
            test "$(node -p "require('./.github/public-release.json').releaseClass")" = "stable"
            node scripts/validate-public-release-contract.mjs candidate "$TAG" "$GITHUB_REPOSITORY" > /dev/null
            python - <<'PY'
          import runpy

          tests = runpy.run_path('tests/test_public_release_downloads.py')
          for name, test in sorted(tests.items()):
              if name.startswith('test_') and callable(test):
                  test()
          PY
          fi
          node scripts/validate-release-evidence.mjs \
            candidate/release-runtime-evidence.json \
            candidate/SHA256SUMS.txt \
            "$TAG" \
            "$candidate_commit" \
            "$EXPECTED_MANIFEST_SHA" \
            "$RELEASE_CLASS" \
            > /dev/null
          gh run download "$SMOKE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-evidence-$TAG" --dir evidence
          CANDIDATE_COMMIT="$candidate_commit" node - <<'NODE'
          const assert = require('node:assert/strict')
          const candidate = require('./candidate/release-runtime-evidence.json')
          const validated = require('./evidence/release-evidence.json')
          assert.deepStrictEqual(candidate, validated, 'draft runtime evidence differs from validated workflow evidence')
          NODE
          CANDIDATE_COMMIT="$candidate_commit" node -e "const e=require('./evidence/release-evidence.json'); const required=['windows-x64','windows-arm64','macos-arm64','macos-x64','linux-x64','linux-arm64']; if(e.tag!==process.env.TAG || e.commit!==process.env.CANDIDATE_COMMIT || e.releaseClass!==process.env.RELEASE_CLASS || e.sha256sumsSha256!==process.env.EXPECTED_MANIFEST_SHA || required.some(k=>e.platforms?.[k]?.decision!=='GO')) process.exit(1)"
          node scripts/validate-release-evidence.mjs \
            evidence/release-evidence.json \
            candidate/SHA256SUMS.txt \
            "$TAG" \
            "$candidate_commit" \
            "$EXPECTED_MANIFEST_SHA" \
            "$RELEASE_CLASS" \
            > /dev/null

      - name: Công khai, hậu kiểm và tự quay về draft nếu hậu kiểm lỗi
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EXPECTED_MANIFEST_SHA: ${{ inputs.sha256sums_sha256 }}
          RELEASE_CLASS: ${{ inputs.release_class }}
        run: |
          set -euo pipefail
          expected_prerelease=false
          [[ "$RELEASE_CLASS" == "community-prerelease" ]] && expected_prerelease=true
          expected_make_latest=false
          [[ "$RELEASE_CLASS" == "stable" ]] && expected_make_latest=true
          release_id="$(jq -r .id release-api.json)"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > prepublish-release-api.json
          test "$(jq -r .id prepublish-release-api.json)" = "$release_id"
          test "$(jq -r .tag_name prepublish-release-api.json)" = "$TAG"
          test "$(jq -r .draft prepublish-release-api.json)" = "true"
          test "$(jq -r .prerelease prepublish-release-api.json)" = "$expected_prerelease"

          assert_tag_binding() {
            local expected_ref_type expected_ref_object expected_commit
            local current_ref_json current_ref_type current_ref_object current_commit current_tag_object
            expected_ref_type="$(jq -r .refType candidate-tag-binding.json)"
            expected_ref_object="$(jq -r .refObject candidate-tag-binding.json)"
            expected_commit="$(jq -r .peeledCommit candidate-tag-binding.json)"
            [[ "$expected_ref_type" == "tag" || "$expected_ref_type" == "commit" ]]
            [[ "$expected_ref_object" =~ ^[0-9a-f]{40}$ ]]
            [[ "$expected_commit" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$expected_commit"
            current_ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
            current_ref_type="$(jq -r .object.type <<<"$current_ref_json")"
            current_ref_object="$(jq -r .object.sha <<<"$current_ref_json")"
            test "$current_ref_type" = "$expected_ref_type"
            test "$current_ref_object" = "$expected_ref_object"
            current_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
            test "$current_commit" = "$expected_commit"
            if [[ "$expected_ref_type" == "tag" ]]; then
              current_tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$expected_ref_object")"
              test "$(jq -r .sha <<<"$current_tag_object")" = "$expected_ref_object"
              test "$(jq -r .object.type <<<"$current_tag_object")" = "commit"
              test "$(jq -r .object.sha <<<"$current_tag_object")" = "$expected_commit"
            else
              test "$expected_ref_object" = "$expected_commit"
            fi
          }
          assert_tag_binding

          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > previous-latest-api.json
          previous_latest="$(jq -r .tag_name previous-latest-api.json)"
          previous_latest_id="$(jq -r .id previous-latest-api.json)"
          [[ "$previous_latest_id" =~ ^[1-9][0-9]*$ ]]
          test "$release_id" != "$previous_latest_id"

          if [[ "$RELEASE_CLASS" == "stable" ]]; then
            TAG="$TAG" PREVIOUS_LATEST="$previous_latest" node --input-type=module <<'NODE'
          import { validateStablePromotionOrder } from './scripts/vietnamese-release.mjs'

          validateStablePromotionOrder({
            previousLatestTag: process.env.PREVIOUS_LATEST,
            tag: process.env.TAG,
          })
          NODE
          fi

          rollback_publication() {
            local original_status=$?
            local rollback_failed=false
            trap - ERR
            echo "::error::Public postcheck failed; returning $TAG to draft and restoring Latest=$previous_latest"
            if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=true -F prerelease="$expected_prerelease" -f make_latest=false \
              > rollback-release-response.json; then
              rollback_failed=true
              echo "::error::Rollback PATCH failed for release id=$release_id"
            fi
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > rollback-release-verify.json; then
              rollback_failed=true
              echo "::error::Rollback state could not be fetched for release id=$release_id"
            elif [[ "$(jq -r .id rollback-release-verify.json)" != "$release_id" || \
              "$(jq -r .tag_name rollback-release-verify.json)" != "$TAG" || \
              "$(jq -r .draft rollback-release-verify.json)" != "true" || \
              "$(jq -r .prerelease rollback-release-verify.json)" != "$expected_prerelease" ]]; then
              rollback_failed=true
              echo "::error::Rollback release state verification failed for id=$release_id"
            fi
            if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$previous_latest_id" \
              -f make_latest=true > rollback-latest-response.json; then
              rollback_failed=true
              echo "::error::Latest restore PATCH failed for release id=$previous_latest_id"
            fi
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/latest" > rollback-latest-verify.json; then
              rollback_failed=true
              echo "::error::Latest restore state could not be fetched"
            elif [[ "$(jq -r .id rollback-latest-verify.json)" != "$previous_latest_id" || \
              "$(jq -r .tag_name rollback-latest-verify.json)" != "$previous_latest" ]]; then
              rollback_failed=true
              echo "::error::Latest restore verification failed"
            fi
            if [[ "$rollback_failed" == "true" ]]; then
              echo "::error::Rollback verification failed; manual release repair is required"
            else
              echo "::notice::Rollback verified for release id=$release_id and Latest=$previous_latest"
            fi
            return "$original_status"
          }
          trap rollback_publication ERR

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -F prerelease="$expected_prerelease" -f make_latest="$expected_make_latest" \
            > publication-response-api.json
          test "$(jq -r .id publication-response-api.json)" = "$release_id"
          test "$(jq -r .tag_name publication-response-api.json)" = "$TAG"
          test "$(jq -r .draft publication-response-api.json)" = "false"
          test "$(jq -r .prerelease publication-response-api.json)" = "$expected_prerelease"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > published-release-api.json
          test "$(jq -r .id published-release-api.json)" = "$(jq -r .id release-api.json)"
          test "$(jq -r .tag_name published-release-api.json)" = "$TAG"
          test "$(jq -r .draft published-release-api.json)" = "false"
          test "$(jq -r .prerelease published-release-api.json)" = "$expected_prerelease"
          test "$(jq -r .html_url published-release-api.json)" = \
            "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          assert_tag_binding
          published_release_id="$(jq -r .id published-release-api.json)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$published_release_id/assets?per_page=100" \
            --slurp > published-release-asset-pages.json
          jq --slurpfile asset_pages published-release-asset-pages.json \
            '.assets = [$asset_pages[0][][]]' published-release-api.json > published-release-api-complete.json
          mv published-release-api-complete.json published-release-api.json
          jq '{isDraft: .draft, isPrerelease: .prerelease, name, body}' \
            published-release-api.json > published-release.json
          TAG="$TAG" REPOSITORY="$GITHUB_REPOSITORY" node <<'NODE'
          const fs = require('fs')
          const stagedApi = JSON.parse(fs.readFileSync('release-api.json', 'utf8'))
          const publishedApi = JSON.parse(fs.readFileSync('published-release-api.json', 'utf8'))
          const stagedByName = new Map(stagedApi.assets.map(asset => [asset.name, asset]))
          const stagedNames = [...stagedByName.keys()].sort()
          const publishedNames = publishedApi.assets.map(asset => asset.name).sort()
          if (JSON.stringify(stagedNames) !== JSON.stringify(publishedNames)) {
            throw new Error('published asset inventory mismatch')
          }
          const prefix = `https://github.com/${process.env.REPOSITORY}/releases/download/${process.env.TAG}/`
          for (const asset of publishedApi.assets) {
            const staged = stagedByName.get(asset.name)
            if (!staged || asset.id !== staged.id || asset.size !== staged.size || asset.digest !== staged.digest) {
              throw new Error(`published asset identity mismatch: ${asset.name}`)
            }
            if (asset.browser_download_url !== prefix + asset.name) {
              throw new Error(`published asset URL mismatch: ${asset.name}`)
            }
          }
          NODE
          TAG="$TAG" RELEASE_JSON_PATH=published-release.json node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import {
            resolveVietnameseReleaseCandidate,
            validateVietnameseReleasePresentation,
          } from './scripts/vietnamese-release.mjs'

          const release = JSON.parse(fs.readFileSync(process.env.RELEASE_JSON_PATH, 'utf8'))
          const candidate = resolveVietnameseReleaseCandidate(process.env.TAG)
          validateVietnameseReleasePresentation({
            body: release.body,
            expectedBody: fs.readFileSync('.github/release-notes-vietnamese.md', 'utf8'),
            expectedTitle: candidate.releaseTitle,
            name: release.name,
          })
          NODE
          mkdir public
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir public
          test "$(sha256sum public/SHA256SUMS.txt | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA"
          node scripts/release-asset-inventory.mjs public release-runtime-evidence.json > /dev/null
          candidate_commit="$(git rev-parse HEAD)"
          node scripts/validate-release-evidence.mjs \
            public/release-runtime-evidence.json \
            public/SHA256SUMS.txt \
            "$TAG" \
            "$candidate_commit" \
            "$EXPECTED_MANIFEST_SHA" \
            "$RELEASE_CLASS" \
            > /dev/null
          cmp candidate/release-runtime-evidence.json public/release-runtime-evidence.json
          cd public
          sha256sum --check SHA256SUMS.txt
          cd ..
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > postpublish-latest-api.json
          latest_tag="$(jq -r .tag_name postpublish-latest-api.json)"
          latest_id="$(jq -r .id postpublish-latest-api.json)"
          if [[ "$RELEASE_CLASS" == "stable" ]]; then
            test "$latest_tag" = "$TAG"
            test "$latest_id" = "$release_id"
          else
            test "$latest_tag" = "$(node -p "require('./.github/public-release.json').tag")"
            test "$latest_tag" = "$previous_latest"
            test "$latest_id" = "$previous_latest_id"
          fi
          trap - ERR
