name: Dựng và phát hành (kênh thử nghiệm và kênh chính)

# Workflow phát hành của kiến trúc composite (kế hoạch 04/09/2026). Hai kênh, ba nền tảng:
# - tag vYYYY.M.D-thunghiem.N → pre-release, không đổi Latest, feed lên nhánh mồ côi feed/thunghiem
# - tag vYYYY.M.D (phải nằm trên main) → release thường, thành Latest, rồi commit lên main:
#   .github/public-release.json (feed kênh chính, notify-only) + khối current-release trong tài liệu
# Ba job dựng chạy song song (Windows x64, macOS Apple Silicon, Linux x64) rồi một job gom tài sản,
# băm SHA-256, tạo release và ghi feed. Lõi phải khớp engine.lock ở mọi job dựng.
# Ký số: Windows chưa ký; macOS ký ad-hoc (không cần Apple Developer, người dùng bấm Open Anyway);
# Linux không có cơ chế ký.

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag đã tồn tại: v2026.9.3-thunghiem.1 (thử nghiệm) hoặc v2026.9.3 (kênh chính)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: build-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Kiểm tag, chọn kênh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.tag.outputs.channel }}
      commit: ${{ steps.tag.outputs.commit }}
      app_version: ${{ steps.tag.outputs.app_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Kiểm tag, chọn kênh, trỏ HEAD
        id: tag
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,3}-thunghiem\.[0-9]{1,4}$ ]]; then
            channel=thunghiem
          elif [[ "$RELEASE_TAG" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,3}$ ]]; then
            channel=latest
            git fetch -q origin main
            git merge-base --is-ancestor HEAD origin/main || { echo "::error::tag kênh chính $RELEASE_TAG phải nằm trên main (merge trước, tag sau)"; exit 1; }
          else
            echo "::error::tag $RELEASE_TAG không phải dạng vYYYY.M.D hoặc vYYYY.M.D-thunghiem.N"; exit 1
          fi
          test "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" = "$(git rev-parse HEAD)" || { echo "::error::tag không trỏ vào checkout"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "app_version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Kênh: $channel"

  build:
    name: Dựng ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            label: Windows x64, chưa ký số
            runner: windows-latest
            platform: win32
            arch: x64
            build_python: python
            targets: ''
          - id: macos-arm64
            label: macOS Apple Silicon, ký ad-hoc
            runner: macos-14
            platform: darwin
            arch: arm64
            build_python: python3
            targets: '--mac dmg'
          - id: linux-x64
            label: Linux x64, AppImage và deb
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            build_python: python3
            targets: '--linux AppImage deb'
    env:
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      HERMES_PAYLOAD_GIT_REF: ${{ needs.prepare.outputs.commit }}
      HERMES_DESKTOP_BUNDLED: '1'
      HERMES_PAYLOAD_TAG: ${{ inputs.tag || github.ref_name }}
      HERMES_PAYLOAD_PYTHON: '3.11'
      HERMES_RELEASE_CLASS: community-prerelease
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Xác minh đúng commit ứng viên
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$HERMES_PAYLOAD_GIT_REF"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Cài npm 12
        run: npm install --global npm@12

      - uses: actions/setup-python@e348410e00f449ece8581cb8e88be8f0e7712da6 # v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.12.1'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Lõi phải khớp engine.lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/engine-sync.mjs check

      - name: Cài phụ thuộc từ lockfile
        uses: ./.github/actions/retry
        with:
          command: npm ci --no-audit --no-fund

      - name: Kiểm thử cleanup uninstaller và thông báo bản mới
        if: matrix.platform == 'win32'
        run: npm run --prefix apps/desktop test:desktop:platforms -- electron/desktop-uninstall.test.ts electron/release-notice.test.ts

      - name: Kiểm thử thông báo bản mới và nhập dữ liệu bản cũ
        if: matrix.platform != 'win32'
        run: npm run --prefix apps/desktop test:desktop:platforms -- electron/release-notice.test.ts electron/legacy-import.test.ts

      - name: Cây làm việc phải sạch trước khi dựng (in ra rồi dọn tệp phụ của bước cài/test)
        shell: bash
        run: |
          # Upstream có hai tệp chỉ khác nhau chữ hoa/thường (contributors/emails/agent@Agents-Mac-mini.local
          # và agent@agents-Mac-mini.local); Windows và macOS mặc định không phân biệt nên luôn báo "modified".
          # Đánh dấu skip-worktree để git status và build script bỏ qua; nội dung lõi không đổi.
          git ls-files contributors/emails | grep -i 'agents-mac-mini' | while read -r f; do git update-index --skip-worktree -- "$f"; done
          git status --porcelain=v1 --untracked-files=normal | tee /tmp/status-before.txt
          if [ -s /tmp/status-before.txt ]; then
            echo "::warning::npm ci / vitest để lại thay đổi ở trên; khôi phục tệp theo dõi và xoá tệp lạ (không đụng tệp bị ignore như node_modules)"
            git checkout -- .
            git clean -fdq
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"

      - name: Dựng runtime và bộ cài
        shell: bash
        env:
          HERMES_PAYLOAD_BUILD_PYTHON: ${{ matrix.build_python }}
          HERMES_BUILD_TARGETS: ${{ matrix.targets }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          export GITHUB_SHA="$HERMES_PAYLOAD_GIT_REF"
          if [ "$TARGET_PLATFORM" = darwin ]; then
            # Ký ad-hoc: không cần chứng thư Apple. macOS coi ứng dụng là "nhà phát triển chưa xác định"
            # thay vì "bị hỏng"; người dùng bấm Open Anyway trong Privacy & Security một lần.
            # Không đặt CSC_IDENTITY_AUTO_DISCOVERY=false vì electron-builder sẽ bỏ ký hoàn toàn.
            node scripts/build-bundled-desktop.mjs --tag="$RELEASE_TAG" --no-install -- -c.mac.identity=-
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            node scripts/build-bundled-desktop.mjs --tag="$RELEASE_TAG" --no-install
          fi

      - name: Kiểm chữ ký ad-hoc của bản macOS
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          app="$(ls -d apps/desktop/release/mac*/*.app | head -1)"
          test -d "$app" || { echo "::error::không thấy .app trong apps/desktop/release"; ls -R apps/desktop/release | head -50; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E 'Signature=adhoc|Identifier=' || true

      - name: Gom tài sản của nền tảng này
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          TARGET_ID: ${{ matrix.id }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          rel=apps/desktop/release
          mkdir -p out
          case "$TARGET_ID" in
            windows-x64)
              primary="Hermes-$APP_VERSION-win-x64.exe"
              test -f "$rel/$primary" || { echo "::error::không thấy $rel/$primary"; ls "$rel"; exit 1; }
              cp "$rel/$primary" out/
              ;;
            macos-arm64)
              primary="Hermes-$APP_VERSION-mac-arm64.dmg"
              test -f "$rel/$primary" || { echo "::error::không thấy $rel/$primary"; ls "$rel"; exit 1; }
              cp "$rel/$primary" out/
              ;;
            linux-x64)
              primary="Hermes-$APP_VERSION-linux-x86_64.AppImage"
              test -f "$rel/$primary" || { echo "::error::không thấy $rel/$primary"; ls "$rel"; exit 1; }
              cp "$rel/$primary" out/
              deb="$(ls "$rel"/Hermes-"$APP_VERSION"-linux-*.deb | head -1)"
              test -f "$deb" || { echo "::error::không thấy gói deb"; ls "$rel"; exit 1; }
              cp "$deb" out/
              ;;
          esac
          # Mô tả tài sản (JSON) cho job gom: tên, kích thước, SHA-256 của từng tệp
          PRIMARY="$primary" node --input-type=module -e '
            import fs from "node:fs"; import crypto from "node:crypto"
            const files = fs.readdirSync("out").filter(f => !f.endsWith(".json")).sort()
            const describe = f => ({ filename: f, size: fs.statSync(`out/${f}`).size, sha256: crypto.createHash("sha256").update(fs.readFileSync(`out/${f}`)).digest("hex") })
            const primary = process.env.PRIMARY
            const manifest = { target: process.env.TARGET_ID, platform: process.env.TARGET_PLATFORM, arch: process.env.TARGET_ARCH, primary: describe(primary), extras: files.filter(f => f !== primary).map(describe) }
            fs.writeFileSync(`out/manifest-${process.env.TARGET_ID}.json`, JSON.stringify(manifest, null, 2) + "\n")
            console.log(JSON.stringify(manifest, null, 2))
          '
          ls -la out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: assets-${{ matrix.id }}
          path: out/
          if-no-files-found: error
          compression-level: 0

  release:
    name: Gom tài sản, tạo release, ghi feed
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      HERMES_PAYLOAD_GIT_REF: ${{ needs.prepare.outputs.commit }}
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: assets-*
          path: assets
          merge-multiple: true

      - name: Băm, tên tương thích, ghi feed theo kênh
        id: feed
        shell: bash
        run: |
          mkdir -p out
          ls -la assets
          cp assets/Hermes-* out/
          if [ "$CHANNEL" = latest ]; then
            cp "assets/Hermes-$APP_VERSION-win-x64.exe" out/Hermes-Vietnamese-Windows-x64-Setup.exe
          fi
          ( cd out && sha256sum Hermes-* > SHA256SUMS.txt && cat SHA256SUMS.txt )
          node --input-type=module -e '
            import fs from "node:fs"
            const channel = process.env.CHANNEL, tag = process.env.RELEASE_TAG, version = process.env.APP_VERSION
            const lock = JSON.parse(fs.readFileSync("engine.lock", "utf8"))
            const engine = { tag: lock.engine.tag, commit: lock.engine.commit }
            const manifests = fs.readdirSync("assets").filter(f => f.startsWith("manifest-")).map(f => JSON.parse(fs.readFileSync(`assets/${f}`, "utf8")))
            const by = id => manifests.find(m => m.target === id)
            const win = by("windows-x64"), mac = by("macos-arm64"), linux = by("linux-x64")
            for (const [id, m] of [["windows-x64", win], ["macos-arm64", mac], ["linux-x64", linux]]) {
              if (!m) { console.error(`::error::thiếu tài sản ${id}`); process.exit(1) }
            }
            const deb = linux.extras.find(e => e.filename.endsWith(".deb"))
            const supportedTargets = ["windows-x64", "macos-arm64", "linux-x64"]
            const windowsX64 = { ...win.primary, authenticode: "NotSigned", ...(channel === "latest" ? { compatibilityFilename: "Hermes-Vietnamese-Windows-x64-Setup.exe" } : {}) }
            const macosArm64 = { ...mac.primary, codesign: "AdHoc", minimumSystemVersion: "12.0" }
            const linuxX64 = { ...linux.primary, ...(deb ? { deb } : {}) }
            const downloadFiles = [
              windowsX64.filename,
              ...(channel === "latest" ? [windowsX64.compatibilityFilename] : []),
              macosArm64.filename,
              linuxX64.filename,
              ...(deb ? [deb.filename] : [])
            ]
            if (channel === "thunghiem") {
              const feed = {
                channel, tag, version, releaseClass: "community-pilot", updateFeedEnabled: true,
                sourceCommit: process.env.HERMES_PAYLOAD_GIT_REF, engine, supportedTargets,
                windowsX64, macosArm64, linuxX64, downloadFiles,
                rollback: "Bản chính không bị đụng; gỡ bản thử nghiệm là quay lui."
              }
              fs.writeFileSync("out/public-release-thunghiem.json", JSON.stringify(feed, null, 2) + "\n")
            } else {
              const prev = JSON.parse(fs.readFileSync(".github/public-release.json", "utf8"))
              const next = {
                ...prev, tag, version,
                versionScheme: "year.month.monthly-update",
                previousTag: prev.tag, rollbackTag: prev.tag,
                releaseClass: "community-pilot",
                artifactProvenanceClass: "github-actions-composite",
                sourceCommit: process.env.HERMES_PAYLOAD_GIT_REF, engine, supportedTargets, updateFeedEnabled: true,
                windowsX64, macosArm64, linuxX64, downloadFiles,
                lifecycle: { runId: Number(process.env.GITHUB_RUN_ID), workflow: "build-release.yml", conclusion: "success" }
              }
              delete next.legacyPlatforms
              fs.writeFileSync("out/public-release.json", JSON.stringify(next, null, 2) + "\n")
            }
            fs.writeFileSync(process.env.GITHUB_OUTPUT, [
              `win_file=${windowsX64.filename}`, `win_size=${windowsX64.size}`, `win_sha=${windowsX64.sha256}`,
              `mac_file=${macosArm64.filename}`, `mac_size=${macosArm64.size}`, `mac_sha=${macosArm64.sha256}`,
              `linux_file=${linuxX64.filename}`, `linux_size=${linuxX64.size}`, `linux_sha=${linuxX64.sha256}`,
              `deb_file=${deb ? deb.filename : ""}`, `deb_size=${deb ? deb.size : ""}`, `deb_sha=${deb ? deb.sha256 : ""}`,
              ""
            ].join("\n"), { flag: "a" })
          '
          ls -la out; cat out/public-release*.json

      - name: Ghi chú phát hành
        shell: bash
        run: |
          engine_tag="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("engine.lock","utf8")).engine.tag)')"
          if [ "$CHANNEL" = thunghiem ]; then
            cat > out/NOTES.md <<EOF
          ## Hermes Vietnamese ${RELEASE_TAG} · bản thử nghiệm

          Đây là **bản thử nghiệm cộng đồng (pre-release), chưa phải Latest**. Windows chưa ký số; macOS ký ad-hoc; Linux không có cơ chế ký.

          Bản này cài **cạnh** bản Hermes cũ, dùng thư mục dữ liệu riêng và mục gỡ cài đặt riêng. Bản cũ và dữ liệu của nó không bị đụng. Muốn quay lui, gỡ bản thử nghiệm.

          Lõi là Hermes Agent **${engine_tag}** nguyên bản của Nous Research (ghim trong \`engine.lock\`), giao diện Việt giữ nguyên, cập nhật kiểu **chỉ báo**: ứng dụng báo bản mới kèm SHA-256, không tự tải hay tự cài.

          | Nền tảng | Tệp | Kích thước | SHA-256 |
          | --- | --- | --- | --- |
          | Windows x64 | \`${{ steps.feed.outputs.win_file }}\` | ${{ steps.feed.outputs.win_size }} byte | \`${{ steps.feed.outputs.win_sha }}\` |
          | macOS Apple Silicon | \`${{ steps.feed.outputs.mac_file }}\` | ${{ steps.feed.outputs.mac_size }} byte | \`${{ steps.feed.outputs.mac_sha }}\` |
          | Linux x64 AppImage | \`${{ steps.feed.outputs.linux_file }}\` | ${{ steps.feed.outputs.linux_size }} byte | \`${{ steps.feed.outputs.linux_sha }}\` |
          | Linux x64 deb | \`${{ steps.feed.outputs.deb_file }}\` | ${{ steps.feed.outputs.deb_size }} byte | \`${{ steps.feed.outputs.deb_sha }}\` |

          **macOS:** lần mở đầu bị chặn, vào **System Settings → Privacy & Security**, bấm **Open Anyway** rồi mở lại. Nếu báo "damaged", chạy \`xattr -cr "/Applications/Hermes Vietnamese.app"\` trong Terminal.
          **Linux:** cấp quyền chạy cho AppImage (\`chmod +x\`) hoặc cài gói deb bằng \`sudo apt install ./<tệp>.deb\`.
          **Windows:** SmartScreen có thể cảnh báo vì bộ cài chưa ký số. Đối chiếu SHA-256 trước khi chạy.
          EOF
          else
            # Ghi chú kênh chính lấy từ .github/release-notes-vietnamese.md đã render (bước sau ghi lên main)
            cp .github/public-release.json /tmp/prev-public-release.json
            cp out/public-release.json .github/public-release.json
            node scripts/render-current-release.mjs
            node scripts/check-public-docs.mjs
            cp .github/release-notes-vietnamese.md out/NOTES.md
          fi

      - name: Tạo release trên GitHub theo kênh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$CHANNEL" = thunghiem ]; then
            assets="out/Hermes-* out/SHA256SUMS.txt out/public-release-thunghiem.json"
            flags="--prerelease --latest=false"
            title="Hermes Vietnamese $RELEASE_TAG (thử nghiệm)"
          else
            assets="out/Hermes-* out/SHA256SUMS.txt"
            flags="--latest"
            title="Hermes Vietnamese ${RELEASE_TAG#v}"
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" $assets --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" $flags --title "$title" --notes-file out/NOTES.md
          else
            gh release create "$RELEASE_TAG" $assets --repo "$GITHUB_REPOSITORY" $flags --title "$title" --notes-file out/NOTES.md
          fi
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name)"
          echo "Latest hiện tại: $latest_tag"
          if [ "$CHANNEL" = thunghiem ]; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)" = "true" || { echo "::error::release không phải pre-release"; exit 1; }
            test "$latest_tag" != "$RELEASE_TAG" || { echo "::error::pre-release lại thành Latest"; exit 1; }
          else
            test "$latest_tag" = "$RELEASE_TAG" || { echo "::error::release kênh chính chưa thành Latest (đang là $latest_tag)"; exit 1; }
          fi

      - name: Cập nhật feed (thử nghiệm → nhánh feed/thunghiem; kênh chính → main)
        shell: bash
        run: |
          git config user.name "hermes-vietnamese-ci"
          git config user.email "LucDinhLe@users.noreply.github.com"
          if [ "$CHANNEL" = thunghiem ]; then
            # Nhánh feed chỉ mang đúng một tệp JSON sinh ra từ bản dựng, lịch sử không có giá trị,
            # nên mỗi lần ghi lại từ đầu rồi đẩy đè.
            git worktree add --detach feedwt
            ( cd feedwt \
              && git checkout --orphan feed-thunghiem-tmp \
              && git rm -rfq --cached . \
              && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + )
            cp out/public-release-thunghiem.json feedwt/public-release-thunghiem.json
            ( cd feedwt && git add public-release-thunghiem.json && git -c commit.gpgsign=false commit -q -m "feed(thunghiem): $RELEASE_TAG" && git push --force origin HEAD:refs/heads/feed/thunghiem )
          else
            # Ghi feed + tài liệu đã render lên main (tag đã được kiểm là nằm trên main)
            git fetch -q origin main
            git worktree add mainwt origin/main
            cp out/public-release.json mainwt/.github/public-release.json
            ( cd mainwt && node scripts/render-current-release.mjs && node scripts/check-public-docs.mjs \
              && git add .github/public-release.json README.md README.vi.md docs/cai-dat-windows-bang-anh.md .github/release-notes-vietnamese.md \
              && git -c commit.gpgsign=false commit -q -m "release: công bố $RELEASE_TAG làm Latest (feed notify-only, tài liệu current-release)" \
              && git push origin HEAD:refs/heads/main )
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-${{ needs.prepare.outputs.channel }}-${{ inputs.tag || github.ref_name }}
          path: out/
          if-no-files-found: error
          compression-level: 0
