name: Calendar pilot exact installer lifecycle
on:
  push:
    branches: [fix/local-stable-d12-product-regressions]
    paths:
      - .github/workflows/calendar-pilot-lifecycle.yml
      - scripts/calendar-lifecycle.ps1
      - apps/desktop/e2e/calendar-installed.spec.ts
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: calendar-pilot-lifecycle
  cancel-in-progress: false
jobs:
  fetch-frozen-inputs:
    if: github.repository == 'LucDinhLe/hermes-agent-vietnamese'
    runs-on: windows-2025
    timeout-minutes: 15
    # GitHub hides drafts from read-only release tokens. Keep this permission
    # in a download-only job: no checkout, dependencies or product execution.
    permissions:
      contents: write
    steps:
      - name: Read existing draft and previous release, without publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path candidate-inputs | Out-Null
          gh release download v2026.9.2 --repo LucDinhLe/hermes-agent-vietnamese --pattern Hermes-2026.9.2-win-x64.exe --dir candidate-inputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release download vi-v0.32.1-18 --repo LucDinhLe/hermes-agent-vietnamese --pattern Hermes-Vietnamese-Windows-x64-Setup.exe --dir candidate-inputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash candidate-inputs/Hermes-2026.9.2-win-x64.exe).Hash.ToLowerInvariant() -ne '34cd44b242efe7bda970056bb873ce4fd0f5f9a7efe9af871134c8e72bf12ea6') { throw 'Candidate hash mismatch' }
          if ((Get-FileHash candidate-inputs/Hermes-Vietnamese-Windows-x64-Setup.exe).Hash.ToLowerInvariant() -ne '565e1313162505999238b9c3b4f1422ec37256a1da153bae5149b5795c83c5ac') { throw 'Previous hash mismatch' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: calendar-frozen-inputs
          path: candidate-inputs/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  exact-windows-installer:
    needs: fetch-frozen-inputs
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        install_scope: [currentuser, allusers]
    env:
      CANDIDATE_COMMIT: 3deaeec8ed311dd7276f6dcb3e641c890adce8e9
      CANDIDATE_SHA256: 34cd44b242efe7bda970056bb873ce4fd0f5f9a7efe9af871134c8e72bf12ea6
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.7.0
      - name: Install test harness dependencies only
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: calendar-frozen-inputs
          path: candidate-inputs/
      - name: Test exact NSIS without inherited developer tools or production credentials
        id: lifecycle
        shell: pwsh
        run: |
          ./scripts/calendar-lifecycle.ps1 -Installer "$env:GITHUB_WORKSPACE/candidate-inputs/Hermes-2026.9.2-win-x64.exe" -Sha256 $env:CANDIDATE_SHA256 -SourceCommit $env:CANDIDATE_COMMIT -PreviousInstaller "$env:GITHUB_WORKSPACE/candidate-inputs/Hermes-Vietnamese-Windows-x64-Setup.exe" -RepoRoot $env:GITHUB_WORKSPACE -InstallScope '${{ matrix.install_scope }}'
      - name: Preserve lifecycle evidence, including failed gates
        if: always() && steps.lifecycle.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: calendar-2026.9.2-lifecycle-${{ matrix.install_scope }}-${{ github.run_id }}
          path: calendar-lifecycle-evidence/
          if-no-files-found: error
          retention-days: 30
