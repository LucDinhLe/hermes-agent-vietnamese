name: Kiểm thử runtime artifact Hermes Vietnamese

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Draft candidate cần nghiệm thu'
        required: true
        type: string
      sha256sums_sha256:
        description: 'SHA-256 của SHA256SUMS.txt; riêng v32 là SHA-256 exact Windows candidate'
        required: true
        type: string
      windows_x64_sha256:
        description: 'SHA-256 exact của Windows x64; bắt buộc cho vòng đời v32.1'
        required: false
        type: string
      release_class:
        description: 'Lớp phát hành phải khớp provenance của draft'
        required: true
        type: choice
        options:
          - community-prerelease
          - stable

permissions:
  contents: read

jobs:
  exact-bytes:
    name: Byte và chữ ký — ${{ matrix.id }}
    if: inputs.tag != 'vi-v0.32.0-1' && inputs.tag != 'vi-v0.32.1-17'
    runs-on: ${{ matrix.runner }}
    environment: release-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-2025
            artifact: Hermes-Vietnamese-Windows-x64-Setup.exe
          - id: windows-arm64
            runner: windows-11-arm
            artifact: Hermes-Vietnamese-Windows-arm64-Setup.exe
          - id: macos-arm64
            runner: macos-15
            artifact: Hermes-Vietnamese-macOS-Apple-Silicon.dmg
          - id: macos-x64
            runner: macos-15-intel
            artifact: Hermes-Vietnamese-macOS-Intel.dmg
          - id: linux-x64
            runner: ubuntu-24.04
            artifact: Hermes-Vietnamese-Linux-x64.AppImage
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            artifact: Hermes-Vietnamese-Linux-arm64.AppImage
    steps:
      - name: Tải đúng artifact từ draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          mkdir candidate
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT" --pattern SHA256SUMS.txt --dir candidate

      - name: Xác minh manifest và byte
        shell: bash
        env:
          EXPECTED_MANIFEST_SHA: ${{ inputs.sha256sums_sha256 }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          node -e "const fs=require('fs'),c=require('crypto'); const h=p=>c.createHash('sha256').update(fs.readFileSync(p)).digest('hex'); if(h('candidate/SHA256SUMS.txt')!==process.env.EXPECTED_MANIFEST_SHA) process.exit(1); const line=fs.readFileSync('candidate/SHA256SUMS.txt','utf8').split(/\r?\n/).find(x=>x.endsWith('  '+process.env.ARTIFACT)); if(!line || h('candidate/'+process.env.ARTIFACT)!==line.slice(0,64)) process.exit(1)"

      - name: Xác minh Authenticode
        if: runner.os == 'Windows' && inputs.release_class == 'stable'
        shell: powershell
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath (Join-Path candidate $env:ARTIFACT)
          if ($signature.Status -ne 'Valid') { throw "Authenticode is $($signature.Status), not Valid" }

      - name: Ghi nhận Windows unsigned cho community prerelease
        if: runner.os == 'Windows' && inputs.release_class == 'community-prerelease'
        shell: powershell
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath (Join-Path candidate $env:ARTIFACT)
          if ($signature.Status -eq 'Valid') { throw 'Community prerelease unexpectedly contains a signed installer' }
          Write-Warning "Unsigned community prerelease: Authenticode=$($signature.Status)"

      - name: Xác minh Developer ID, Gatekeeper và stapling
        if: runner.os == 'macOS' && inputs.release_class == 'stable'
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          mount_point="$(mktemp -d)"
          hdiutil attach "candidate/$ARTIFACT" -nobrowse -readonly -mountpoint "$mount_point"
          app="$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          hdiutil detach "$mount_point"

      - name: Ghi nhận macOS chưa notarize cho community prerelease
        if: runner.os == 'macOS' && inputs.release_class == 'community-prerelease'
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          mount_point="$(mktemp -d)"
          hdiutil attach "candidate/$ARTIFACT" -nobrowse -readonly -mountpoint "$mount_point"
          app="$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          codesign --display --verbose=4 "$app" 2>&1 || true
          spctl --assess --type execute --verbose=4 "$app" 2>&1 || true
          if xcrun stapler validate "$app"; then
            echo "::error::community prerelease unexpectedly contains a stapled notarization ticket"
            hdiutil detach "$mount_point"
            exit 1
          fi
          hdiutil detach "$mount_point"

  evidence:
    name: Đối chiếu smoke thật trên đúng máy và artifact
    if: inputs.tag != 'vi-v0.32.0-1' && inputs.tag != 'vi-v0.32.1-17'
    needs: exact-bytes
    runs-on: ubuntu-24.04
    environment: release-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Tải bằng chứng và manifest từ draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir candidate
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --pattern release-runtime-evidence.json --dir candidate

      - name: Bắt buộc đủ fresh/update/repair/uninstall/rollback trên cả sáu máy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          MANIFEST_SHA: ${{ inputs.sha256sums_sha256 }}
          RELEASE_CLASS: ${{ inputs.release_class }}
        run: |
          candidate_commit="$(git rev-parse HEAD)"
          test "$candidate_commit" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          node scripts/validate-release-evidence.mjs \
            candidate/release-runtime-evidence.json \
            candidate/SHA256SUMS.txt \
            "$TAG" \
            "$candidate_commit" \
            "$MANIFEST_SHA" \
            "$RELEASE_CLASS" \
            > release-evidence.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ inputs.tag }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 90

  v32-windows-lifecycle:
    name: V32 Windows x64 — fresh, update, repair, uninstall, rollback
    if: inputs.tag == 'vi-v0.32.0-1' && inputs.release_class == 'community-prerelease'
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.1
          cache: npm

      - name: Cài dependency kiểm thử từ lockfile
        shell: powershell
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Khôi phục cache ba installer exact
        id: lifecycle-input-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}\hermes-v32-release-inputs
          key: hermes-v32-lifecycle-inputs-efc3d863a37882c6-cca0f3c0255e5e87-e4e0b60d7821b0e7

      - name: Tải ba installer đã khóa byte
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CANDIDATE_SHA256: ${{ inputs.sha256sums_sha256 }}
          CACHE_HIT: ${{ steps.lifecycle-input-cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path C:\HermesEvidence -Force | Out-Null
          [System.IO.File]::WriteAllText(
            'C:\HermesEvidence\draft-download-attempt.json',
            "{`"runId`":`"$env:GITHUB_RUN_ID`",`"attempt`":`"$env:GITHUB_RUN_ATTEMPT`",`"harnessCommit`":`"$env:GITHUB_SHA`"}`n"
          )
          $inputRoot = Join-Path $env:RUNNER_TEMP 'hermes-v32-release-inputs'
          $candidateDir = Join-Path $inputRoot 'candidate'
          $previousDir = Join-Path $inputRoot 'previous'
          $rollbackDir = Join-Path $inputRoot 'rollback'
          New-Item -ItemType Directory -Path $candidateDir, $previousDir, $rollbackDir -Force | Out-Null

          $releaseJson = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --slurp
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enumerate candidate drafts' }
          $pages = $releaseJson | ConvertFrom-Json
          $matches = @()
          foreach ($page in @($pages)) {
            $matches += @($page | Where-Object { $_.tag_name -eq $env:TAG })
          }
          if ($matches.Count -ne 1) { throw "Expected one draft for $env:TAG, got $($matches.Count)" }
          $release = $matches[0]
          if ($release.draft -ne $true -or $release.prerelease -ne $true) { throw 'Candidate is not a private prerelease draft' }
          $assets = @($release.assets | Where-Object { $_.name -eq 'Hermes-Vietnamese-Windows-x64-Setup.exe' })
          if ($assets.Count -ne 1) { throw "Expected one Windows x64 candidate asset, got $($assets.Count)" }
          $asset = $assets[0]
          if ($asset.state -ne 'uploaded' -or $asset.size -ne 341176379) { throw 'Draft candidate asset metadata is not exact' }
          if ($asset.digest -ne "sha256:$($env:CANDIDATE_SHA256.ToLowerInvariant())") { throw 'Draft candidate digest is not exact' }
          $candidatePath = Join-Path $candidateDir 'Hermes-Vietnamese-Windows-x64-Setup.exe'
          if ($env:CACHE_HIT -ne 'true') {
            $headers = @{
              Accept = 'application/octet-stream'
              Authorization = "Bearer $env:GH_TOKEN"
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            Invoke-WebRequest -Uri $asset.url -Headers $headers -OutFile $candidatePath

            gh release download vi-v0.31.0-7 --repo $env:GITHUB_REPOSITORY --pattern Hermes-Vietnamese-Windows-x64-Setup.exe --dir $previousDir
            if ($LASTEXITCODE -ne 0) { throw 'Cannot download pinned v31 installer' }
            gh release download vi-v0.20.4-39 --repo $env:GITHUB_REPOSITORY --pattern Hermes-Vietnamese-Windows-x64-Setup.exe --dir $rollbackDir
            if ($LASTEXITCODE -ne 0) { throw 'Cannot download pinned vi39 installer' }
          }

          $records = @(
            @{ Path = $candidatePath; Size = 341176379; Sha256 = $env:CANDIDATE_SHA256 },
            @{ Path = (Join-Path $previousDir 'Hermes-Vietnamese-Windows-x64-Setup.exe'); Size = 340302846; Sha256 = 'cca0f3c0255e5e8736676a4d7ccb52c6e1b75eb73b94b8d1c3ca5dc91e57e840' },
            @{ Path = (Join-Path $rollbackDir 'Hermes-Vietnamese-Windows-x64-Setup.exe'); Size = 340105286; Sha256 = 'e4e0b60d7821b0e72af7b79e745b723c035f588c49bb11782778214a3e0c6d31' }
          )
          foreach ($record in $records) {
            $item = Get-Item -LiteralPath $record.Path
            if ($item.Length -ne $record.Size) { throw "Installer size mismatch: $($record.Path)" }
            $digest = (Get-FileHash -LiteralPath $record.Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($digest -ne $record.Sha256.ToLowerInvariant()) { throw "Installer SHA-256 mismatch: $($record.Path)" }
          }

      - name: Lưu cache ba installer exact sau khi đã xác minh
        if: steps.lifecycle-input-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}\hermes-v32-release-inputs
          key: hermes-v32-lifecycle-inputs-efc3d863a37882c6-cca0f3c0255e5e87-e4e0b60d7821b0e7

      - name: Chạy vòng đời thật trong máy ảo GitHub dùng một lần
        shell: powershell
        env:
          CANDIDATE_SHA256: ${{ inputs.sha256sums_sha256 }}
        run: |
          New-Item -ItemType Directory -Path C:\HermesEvidence -Force | Out-Null
          [System.IO.File]::WriteAllText(
            'C:\HermesEvidence\workflow-preflight.json',
            "{`"runId`":`"$env:GITHUB_RUN_ID`",`"attempt`":`"$env:GITHUB_RUN_ATTEMPT`",`"harnessCommit`":`"$env:GITHUB_SHA`"}`n"
          )
          $inputRoot = Join-Path $env:RUNNER_TEMP 'hermes-v32-release-inputs'
          $candidate = (Resolve-Path (Join-Path $inputRoot 'candidate\Hermes-Vietnamese-Windows-x64-Setup.exe')).Path
          $previous = (Resolve-Path (Join-Path $inputRoot 'previous\Hermes-Vietnamese-Windows-x64-Setup.exe')).Path
          $rollback = (Resolve-Path (Join-Path $inputRoot 'rollback\Hermes-Vietnamese-Windows-x64-Setup.exe')).Path
          $nodeRuntime = Split-Path -Parent (Get-Command node.exe).Source
          $evidence = "C:\HermesEvidence\v32-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          node scripts/windows-lifecycle-acceptance/run.mjs `
            --isolation-mode github-hosted-ephemeral-vm `
            --candidate $candidate `
            --candidate-sha256 $env:CANDIDATE_SHA256 `
            --candidate-commit 81a0c7c53c6e0a42ba56af82c0bc72eb31727b0f `
            --harness-commit $env:GITHUB_SHA `
            --previous $previous `
            --previous-sha256 cca0f3c0255e5e8736676a4d7ccb52c6e1b75eb73b94b8d1c3ca5dc91e57e840 `
            --rollback $rollback `
            --rollback-sha256 e4e0b60d7821b0e72af7b79e745b723c035f588c49bb11782778214a3e0c6d31 `
            --node-runtime-dir $nodeRuntime `
            --evidence-dir $evidence `
            --timeout-minutes 105

      - name: Lưu bằng chứng vòng đời kể cả khi fail-closed
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v32-windows-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: C:\HermesEvidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  v321-windows-lifecycle:
    name: V32.1 Windows x64 — project/session safety và full lifecycle
    if: inputs.tag == 'vi-v0.32.1-17' && inputs.release_class == 'community-prerelease'
    permissions:
      # GitHub hides draft releases from read-only tokens. Write is required to
      # resolve/download the private draft; this job never mutates the release.
      contents: write
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.1
          cache: npm

      - name: Cài dependency kiểm thử từ lockfile
        shell: powershell
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Khôi phục cache ba installer exact v32.1
        id: v321-lifecycle-input-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}\hermes-v321-release-inputs
          key: hermes-v321-lifecycle-inputs-${{ inputs.windows_x64_sha256 }}-efc3d863a37882c6-e4e0b60d7821b0e7

      - name: Tải candidate v32.1, public v32 và rollback đã khóa byte
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CANDIDATE_SHA256: ${{ inputs.windows_x64_sha256 }}
          CACHE_HIT: ${{ steps.v321-lifecycle-input-cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            throw 'windows_x64_sha256 must be the exact 64-character candidate SHA-256'
          }

          New-Item -ItemType Directory -Path C:\HermesEvidence -Force | Out-Null
          [System.IO.File]::WriteAllText(
            'C:\HermesEvidence\v321-draft-download-attempt.json',
            "{`"runId`":`"$env:GITHUB_RUN_ID`",`"attempt`":`"$env:GITHUB_RUN_ATTEMPT`",`"tag`":`"$env:TAG`"}`n"
          )
          $expectedCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $expectedCommit -notmatch '^[0-9a-f]{40}$') {
            throw 'Cannot resolve exact checked-out candidate commit'
          }
          $tagCommit = (git rev-list -n 1 $env:TAG).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $expectedCommit) {
            throw "Candidate tag does not match checked-out harness commit: tag=$tagCommit checkout=$expectedCommit"
          }
          "CANDIDATE_COMMIT=$expectedCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $inputRoot = Join-Path $env:RUNNER_TEMP 'hermes-v321-release-inputs'
          $candidateDir = Join-Path $inputRoot 'candidate'
          $previousDir = Join-Path $inputRoot 'previous'
          $rollbackDir = Join-Path $inputRoot 'rollback'
          New-Item -ItemType Directory -Path $candidateDir, $previousDir, $rollbackDir -Force | Out-Null

          function Invoke-GhWithRetry {
            param(
              [Parameter(Mandatory = $true)] [string[]] $Arguments,
              [Parameter(Mandatory = $true)] [string] $Label
            )
            for ($attempt = 1; $attempt -le 4; $attempt += 1) {
              $output = @(& gh @Arguments)
              if ($LASTEXITCODE -eq 0) { return ($output -join [Environment]::NewLine) }
              if ($attempt -eq 4) { throw "$Label failed after $attempt attempts" }
              $delay = 10 * $attempt
              Write-Warning "$Label failed on attempt $attempt; retrying in $delay seconds"
              Start-Sleep -Seconds $delay
            }
          }

          $releaseJson = Invoke-GhWithRetry `
            -Arguments @('release', 'view', $env:TAG, '--repo', $env:GITHUB_REPOSITORY, '--json', 'isDraft,isPrerelease,assets') `
            -Label 'Cannot resolve the exact candidate draft'
          $release = $releaseJson | ConvertFrom-Json
          if ($release.isDraft -ne $true -or $release.isPrerelease -ne $true) {
            throw 'v32.1 candidate is not a private prerelease draft'
          }
          $assets = @($release.assets | Where-Object { $_.name -eq 'Hermes-Vietnamese-Windows-x64-Setup.exe' })
          if ($assets.Count -ne 1) { throw "Expected one Windows x64 candidate asset, got $($assets.Count)" }
          $asset = $assets[0]
          if ($asset.state -ne 'uploaded' -or [Int64]$asset.size -le 0) {
            throw 'Draft candidate asset metadata is incomplete'
          }
          if ($asset.digest -ne "sha256:$($env:CANDIDATE_SHA256.ToLowerInvariant())") {
            throw 'Draft candidate digest is not exact'
          }

          $candidatePath = Join-Path $candidateDir 'Hermes-Vietnamese-Windows-x64-Setup.exe'
          if ($env:CACHE_HIT -ne 'true') {
            Invoke-GhWithRetry `
              -Arguments @('release', 'download', $env:TAG, '--repo', $env:GITHUB_REPOSITORY, '--pattern', 'Hermes-Vietnamese-Windows-x64-Setup.exe', '--dir', $candidateDir, '--clobber') `
              -Label 'Cannot download the exact v32.1 candidate' | Out-Null
            Invoke-GhWithRetry `
              -Arguments @('release', 'download', 'vi-v0.32.0-1', '--repo', $env:GITHUB_REPOSITORY, '--pattern', 'Hermes-Vietnamese-Windows-x64-Setup.exe', '--dir', $previousDir, '--clobber') `
              -Label 'Cannot download pinned public v32 installer' | Out-Null
            Invoke-GhWithRetry `
              -Arguments @('release', 'download', 'vi-v0.20.4-39', '--repo', $env:GITHUB_REPOSITORY, '--pattern', 'Hermes-Vietnamese-Windows-x64-Setup.exe', '--dir', $rollbackDir, '--clobber') `
              -Label 'Cannot download pinned vi39 installer' | Out-Null
          }

          $records = @(
            @{ Path = $candidatePath; Size = [Int64]$asset.size; Sha256 = $env:CANDIDATE_SHA256 },
            @{ Path = (Join-Path $previousDir 'Hermes-Vietnamese-Windows-x64-Setup.exe'); Size = 341176379; Sha256 = 'efc3d863a37882c669d571456711264e2aa4f60b66bf9e67ff2441ce491ceeac' },
            @{ Path = (Join-Path $rollbackDir 'Hermes-Vietnamese-Windows-x64-Setup.exe'); Size = 340105286; Sha256 = 'e4e0b60d7821b0e72af7b79e745b723c035f588c49bb11782778214a3e0c6d31' }
          )
          foreach ($record in $records) {
            $item = Get-Item -LiteralPath $record.Path
            if ($item.Length -ne $record.Size) { throw "Installer size mismatch: $($record.Path)" }
            $digest = (Get-FileHash -LiteralPath $record.Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($digest -ne $record.Sha256.ToLowerInvariant()) { throw "Installer SHA-256 mismatch: $($record.Path)" }
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $candidatePath
          if ($signature.Status -ne 'NotSigned' -or $null -ne $signature.SignerCertificate) {
            throw "v32.1 community candidate must be explicitly NotSigned, got $($signature.Status)"
          }
          Write-Warning 'v32.1 is an unsigned community pilot; Windows may show Publisher: Unknown or SmartScreen warnings'

      - name: Lưu cache ba installer exact v32.1 sau khi xác minh
        if: steps.v321-lifecycle-input-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}\hermes-v321-release-inputs
          key: hermes-v321-lifecycle-inputs-${{ inputs.windows_x64_sha256 }}-efc3d863a37882c6-e4e0b60d7821b0e7

      - name: Chạy exact v32.1 trong máy ảo GitHub dùng một lần
        shell: powershell
        env:
          CANDIDATE_SHA256: ${{ inputs.windows_x64_sha256 }}
        run: |
          New-Item -ItemType Directory -Path C:\HermesEvidence -Force | Out-Null
          [System.IO.File]::WriteAllText(
            'C:\HermesEvidence\v321-workflow-preflight.json',
            "{`"runId`":`"$env:GITHUB_RUN_ID`",`"attempt`":`"$env:GITHUB_RUN_ATTEMPT`",`"candidateCommit`":`"$env:CANDIDATE_COMMIT`"}`n"
          )
          $inputRoot = Join-Path $env:RUNNER_TEMP 'hermes-v321-release-inputs'
          $candidate = (Resolve-Path (Join-Path $inputRoot 'candidate\Hermes-Vietnamese-Windows-x64-Setup.exe')).Path
          $previous = (Resolve-Path (Join-Path $inputRoot 'previous\Hermes-Vietnamese-Windows-x64-Setup.exe')).Path
          $rollback = (Resolve-Path (Join-Path $inputRoot 'rollback\Hermes-Vietnamese-Windows-x64-Setup.exe')).Path
          $nodeRuntime = Split-Path -Parent (Get-Command node.exe).Source
          $evidence = "C:\HermesEvidence\v321-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          node scripts/windows-lifecycle-acceptance/run.mjs `
            --isolation-mode github-hosted-ephemeral-vm `
            --candidate $candidate `
            --candidate-sha256 $env:CANDIDATE_SHA256 `
