name: Công khai pilot Hermes Vietnamese

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Draft community prerelease cần công khai'
        required: true
        type: string
      sha256sums_sha256:
        description: 'SHA-256 của SHA256SUMS.txt trong draft'
        required: true
        type: string
      staging_run_id:
        description: 'Run ID dựng/staging đã xanh trên toàn bộ artifact'
        required: true
        type: string

concurrency:
  group: hermes-vietnamese-promotion
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  promote:
    name: Kiểm pilot Windows x64 và công khai community prerelease
    runs-on: ubuntu-24.04
    environment: release-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.tag }}

      - name: Xác minh draft, byte, provenance và staging run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EXPECTED_MANIFEST_SHA: ${{ inputs.sha256sums_sha256 }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^vi-v(0|[1-9][0-9]{0,2})\.[0-9]+\.[0-9]+-(0|[1-9][0-9]*)$ ]]

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,name,body > candidate-release.json
          test "$(jq -r .isDraft candidate-release.json)" = "true"
          test "$(jq -r .isPrerelease candidate-release.json)" = "true"
          TAG="$TAG" RELEASE_JSON_PATH=candidate-release.json node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import {
            resolveVietnameseReleaseCandidate,
            validateFeaturedCandidatePromotion,
            validateVietnameseReleaseNotesForClass,
            validateVietnameseReleasePresentation,
          } from './scripts/vietnamese-release.mjs'

          const release = JSON.parse(fs.readFileSync(process.env.RELEASE_JSON_PATH, 'utf8'))
          const candidate = resolveVietnameseReleaseCandidate(process.env.TAG)
          const publicRelease = JSON.parse(fs.readFileSync('.github/public-release.json', 'utf8'))
          validateFeaturedCandidatePromotion({
            featuredCandidate: publicRelease.featuredCandidate,
            tag: process.env.TAG,
          })
          const expectedBody = fs.readFileSync('.github/release-notes-vietnamese.md', 'utf8')
          validateVietnameseReleaseNotesForClass({
            body: expectedBody,
            releaseClass: 'community-prerelease',
          })
          validateVietnameseReleasePresentation({
            body: release.body,
            expectedBody,
            expectedTitle: candidate.releaseTitle,
            name: release.name,
          })
          NODE
          body="$(jq -r .body candidate-release.json)"
          grep -Fq 'Windows x64: exact-artifact smoke đạt' <<<"$body"
          grep -Fq 'chưa có smoke trên máy người dùng' <<<"$body"
          grep -Fq 'SignPath' <<<"$body"
          grep -Fq 'chưa tham gia Apple Developer Program' <<<"$body"

          # The immutable candidate commit deliberately describes the target
          # public state before mutation. URLs may still 404 while the release
          # is a draft, but promotion cannot publish stale/false README metadata.
          python - <<'PY'
          import runpy

          tests = runpy.run_path('tests/test_public_release_downloads.py')
          for name, test in sorted(tests.items()):
              if name.startswith('test_') and callable(test):
                  test()
          PY

          mkdir candidate
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir candidate
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release-api.json
          TAG="$TAG" REPOSITORY="$GITHUB_REPOSITORY" node <<'NODE'
          const fs = require('fs')
          const api = JSON.parse(fs.readFileSync('release-api.json', 'utf8'))
          const local = fs.readdirSync('candidate').sort()
          const remote = api.assets.map(asset => asset.name).sort()
          if (JSON.stringify(local) !== JSON.stringify(remote)) throw new Error('draft asset inventory mismatch')
          const prefix = `https://github.com/${process.env.REPOSITORY}/releases/download/${process.env.TAG}/`
          for (const asset of api.assets) {
            if (asset.browser_download_url !== prefix + asset.name) throw new Error(`asset URL mismatch: ${asset.name}`)
            if (asset.size !== fs.statSync(`candidate/${asset.name}`).size) throw new Error(`asset size mismatch: ${asset.name}`)
          }
          NODE

          actual_manifest_sha="$(sha256sum candidate/SHA256SUMS.txt | cut -d' ' -f1)"
          test "$actual_manifest_sha" = "$EXPECTED_MANIFEST_SHA"

          candidate_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          test "$(git rev-parse HEAD)" = "$candidate_commit"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID")"
          test "$(jq -r .name <<<"$run_json")" = "Dựng và staging Hermes Vietnamese"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          test "$(jq -r .head_sha <<<"$run_json")" = "$candidate_commit"

          node scripts/validate-pilot-release-evidence.mjs \
            candidate/pilot-release-evidence.json \
            candidate/candidate-provenance.json \
            candidate/SHA256SUMS.txt \
            "$TAG" \
            "$candidate_commit" \
            "$EXPECTED_MANIFEST_SHA" \
            "$STAGING_RUN_ID" \
            > /dev/null
          (cd candidate && sha256sum --check SHA256SUMS.txt)

      - name: Công khai, hậu kiểm và tự quay về draft nếu có lỗi
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EXPECTED_MANIFEST_SHA: ${{ inputs.sha256sums_sha256 }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          set -euo pipefail
          previous_latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          committed_latest="$(node -p "require('./.github/public-release.json').tag")"
          test "$previous_latest" = "$committed_latest"
          test "$TAG" != "$previous_latest"

          rollback_publication() {
            trap - ERR
            echo "::error::Pilot postcheck failed; returning $TAG to draft and restoring Latest=$previous_latest"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=true --prerelease=true --latest=false || true
            if [[ -n "$previous_latest" && "$previous_latest" != "$TAG" ]]; then
              gh release edit "$previous_latest" --repo "$GITHUB_REPOSITORY" --latest || true
            fi
            return 1
          }
          trap rollback_publication ERR

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=true --latest=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,url,name,body > published-release.json
          test "$(jq -r .isDraft published-release.json)" = "false"
          test "$(jq -r .isPrerelease published-release.json)" = "true"
          TAG="$TAG" RELEASE_JSON_PATH=published-release.json node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import {
            resolveVietnameseReleaseCandidate,
            validateVietnameseReleasePresentation,
          } from './scripts/vietnamese-release.mjs'

          const release = JSON.parse(fs.readFileSync(process.env.RELEASE_JSON_PATH, 'utf8'))
          const candidate = resolveVietnameseReleaseCandidate(process.env.TAG)
          validateVietnameseReleasePresentation({
            body: release.body,
            expectedBody: fs.readFileSync('.github/release-notes-vietnamese.md', 'utf8'),
            expectedTitle: candidate.releaseTitle,
            name: release.name,
          })
          NODE
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$previous_latest"

          mkdir public
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir public
          test "$(sha256sum public/SHA256SUMS.txt | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA"
          candidate_commit="$(git rev-parse HEAD)"
          node scripts/validate-pilot-release-evidence.mjs \
            public/pilot-release-evidence.json \
            public/candidate-provenance.json \
            public/SHA256SUMS.txt \
            "$TAG" \
            "$candidate_commit" \
            "$EXPECTED_MANIFEST_SHA" \
            "$STAGING_RUN_ID" \
            > /dev/null
          (cd public && sha256sum --check SHA256SUMS.txt)
          cmp candidate/pilot-release-evidence.json public/pilot-release-evidence.json
          mkdir public-http
          curl --fail --location --silent --show-error \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/SHA256SUMS.txt" \
            --output public-http/SHA256SUMS.txt
          test "$(sha256sum public-http/SHA256SUMS.txt | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA"
          jq -r .url published-release.json
          trap - ERR
